  return `${xbar("Ficha do evento", "Resumo para a equipa: serviços, fornecedores, horário e notas.", [{k:"ficha", n:"Exportar ficha", ok:true}])}
  <div class="cols"><div class="stack">
    <section class="panel"><div class="panel-h"><h2>Serviços e fornecedores</h2><button class="btn ghost sm" data-act="tab" data-tab="os">Gerir ordens de serviço</button></div>
      ${mods.length ? `<div class="tw"><table><thead><tr><th>Serviço</th><th>Fornecedor</th><th>Horário</th><th>OS</th>${M() ? `<th class="num">A pagar</th>` : ""}</tr></thead><tbody>${mods.map(m => { const d = ev[m.k] || {}, o = osOf(ev, m.k); const T = timeline(ev).filter(x => x.mod === m.k);
        return `<tr><td><span style="display:inline-flex;gap:8px;align-items:center">${lnb(m.k)}${m.n}</span></td><td>${d.fornecedor ? h(d.fornecedor) : `<span class="chip s-warn">Por definir</span>`}</td><td class="mono small">${T.length ? fmtMin(T[0].m) + "–" + fmtMin(Math.max(...T.map(x => x.m + num(x.dur)))) : "—"}</td><td>${osChip(o.estado)}</td>${M() ? `<td class="num mono">${money(t.custoMod[m.k])}</td>` : ""}</tr>`; }).join("")}</tbody></table></div>` : `<p class="muted">Este evento não tem serviços ativos. Usa "Editar dados" para os escolher.</p>`}
    </section>
    ${mods.length ? `<section class="panel"><div class="panel-h"><div><h2>Fornecedores sugeridos</h2><span class="small muted">${evLocal(ev) ? "Perto de " + h(evLocal(ev)) + " · " : ""}custo estimado pelo catálogo para ${num(ev.convidados) + num(ev.criancas)} pessoas</span></div></div>${sugBox(mods.map(m => m.k), evLocal(ev), num(ev.convidados) + num(ev.criancas), ev)}</section>` : ""}
    <section class="panel"><h2 style="margin-bottom:10px">No dia</h2><dl class="kv"><dt>Localidade</dt><dd>${h(ev.local || "—")}</dd><dt>Contacto no dia</dt><dd>${h(ev.contactoDia || "—")}</dd><dt>Dress code</dt><dd>${h(ev.dressCode || "—")}</dd><dt>Restrições alimentares</dt><dd>${h(ev.restricoes || "—")}</dd><dt>Notas internas</dt><dd>${nl(ev.notas || "—")}</dd></dl></section>
    ${evTasksPanel(ev)}
  </div><div class="stack">
    ${M() ? `<section class="panel"><h2 style="margin-bottom:12px">Contas do evento</h2><div class="money-box">
      <div class="r"><span>Venda (s/ IVA)</span><b>${money(t.sub)}</b></div><div class="r"><span>Custo de fornecedores</span><b>− ${money(t.custo)}</b></div><div class="r" style="border-top:1px solid var(--line);padding-top:6px"><span><b>Margem</b></span><b class="${t.margem < 0 ? "neg" : "pos"}">${money(t.margem)} · ${pct(t.mpct)}</b></div></div>
      <dl class="kv" style="margin-top:12px"><dt>A receber do cliente</dt><dd class="mono">${money(t.falta)}</dd><dt>A pagar a fornecedores</dt><dd class="mono">${money(t.aPagar)}</dd></dl></section>` : ""}
    <section class="panel"><h2 style="margin-bottom:12px">Produção</h2><div class="prog">${p.mods ? meter(p.osOk, p.mods, "Ordens de serviço confirmadas") : ""}${meter(p.cOk, p.cN, "Checklist")}${p.late ? `<span class="chip s-bad">${p.late} tarefa${p.late > 1 ? "s" : ""} atrasada${p.late > 1 ? "s" : ""}</span>` : ""}${M() ? meter(t.pago, t.total, "Recebido do cliente", money(t.pago) + " de " + money(t.total)) : ""}</div></section>
    <section class="panel"><h2 style="margin-bottom:10px">Cliente</h2><dl class="kv"><dt>Nome</dt><dd><button class="btn ghost sm" style="padding:0;white-space:normal;text-align:left" data-act="openCli" data-id="${ev.clienteId}">${h(c.nome)}</button></dd><dt>NIF</dt><dd class="mono">${h(c.nif || "—")}</dd><dt>Contacto</dt><dd>${h(c.contacto || "—")}</dd><dt>Telefone</dt><dd>${h(c.telefone || "—")}</dd><dt>Email</dt><dd>${h(c.email || "—")}</dd>${billing(ev).outra ? `<dt>Faturar a</dt><dd><b>${h(billing(ev).nome)}</b>${billing(ev).nif ? ` · NIF ${h(billing(ev).nif)}` : ""}</dd>` : ""}</dl></section>
    ${M() ? `<section class="panel"><div class="spread"><span class="muted">Apagar este evento</span><span><button class="btn sm danger" data-act="askDel" data-what="eventos" data-id="${ev.id}">Apagar</button></span></div></section>` : ""}
  </div></div>`;
}

      {k:"proposta", n:"Exportar proposta", ok:L.length > 0, falta:"Adiciona linhas"},
      {k:"proforma", n:"Exportar proforma", ok:p.estado === "aceite" && L.length > 0, falta:"Marca como aceite", pri:false}])}

  <section class="panel">

        <td class="num mono">${money(lineSale(l))}</td>

        <td><button class="btn ghost sm danger" data-act="delRow" data-list="${LL}" data-row="${l.id}" aria-label="Remover linha">✕</button></td></tr>`; }).join("")}

        <tr><td colspan="7" class="num muted">Subtotal (s/ IVA)</td><td class="num mono">${money(t.sub)}</td><td class="num mono">${money(t.sub - L.reduce((a,l) => a + lineCost(l), 0))}</td><td></td></tr>

        <tr><td colspan="7" class="num">Total ao cliente</td><td class="num mono">${money(t.total)}</td><td></td><td></td></tr>
        <tr><td colspan="7" class="num muted">Por pessoa (${pax(ev)} pax)</td><td class="num mono muted">${money(pax(ev) ? t.total / pax(ev) : 0)}</td><td></td><td></td></tr>
      </tfoot></table></div>` : `<div class="empty">A proposta ainda não tem linhas. Adiciona artigos do catálogo dos teus fornecedores: o custo e o preço de venda entram automaticamente.</div>`}
    <div class="grid" style="margin-top:16px"><label class="field"><span>Válida até</span><input type="date" data-ev="${ev.id}" data-path="proposta.validade" value="${h(p.validade)}"></label>

  </section>`;
}

/* ---------- Timeline: linha de metro vertical ---------- */
function evTimeline(ev){
  const T = timeline(ev), isToday = daysTo(ev.data) === 0, done = T.filter(t => t.feito).length;
  const next = T.find(t => !t.feito);
  const modOpts = [["","Organização"],["cliente","Cliente"], ...activeMods(ev).map(m => [m.k, m.n])];
  let lastFase = null, html = "";
  T.forEach((t, i) => {
    const pc = `var(--ph-${FASES.includes(t.fase) ? t.fase.toLowerCase() : "evento"})`;
    if (t.fase !== lastFase){ html += `<div class="zone ${lastFase === null ? "first" : ""}" style="--pc:${pc}"><span class="rail"></span><span class="zl">${h(t.fase || "Sem fase")} · ${T.filter(x => x.fase === t.fase).length}</span></div>`; lastFase = t.fase; }
    const d = num(t.dur), last = i === T.length - 1, isNext = next && next.id === t.id && (isToday || done > 0);
    html += `<div class="stn ${t.feito ? "done" : ""} ${isNext ? "next" : ""} ${last ? "last" : ""}" id="row-${t.id}" style="--c:${laneVar(t.mod)};--pc:${pc}">
      <div class="tm">${t.m !== null ? fmtMin(t.m) : "—"}${d && t.m !== null ? `<small>até ${fmtMin(t.m + d)}</small>` : ""}</div>
      <div class="rl"><span class="dot"></span></div>
      <div class="bd"><div class="ttl">${h(t.acao || "Paragem sem nome")}</div><div class="meta">${lnb(t.mod)}<span>${h(LANES[t.mod || ""] || "")}</span>${t.resp ? `<span>· ${h(t.resp)}</span>` : ""}${t.local ? `<span>· ${h(t.local)}</span>` : ""}${d ? `<span>· ${durTxt(d)}</span>` : ""}</div></div>
      <div class="act"><input type="checkbox" data-ev="${ev.id}" data-list="timeline" data-row="${t.id}" data-f="feito" ${t.feito ? "checked" : ""} aria-label="Concluído: ${h(t.acao)}" title="Marcar como concluído"><button class="btn sm ${R.edit === t.id ? "pri" : ""}" data-act="editStn" data-row="${t.id}">${R.edit === t.id ? "Fechar" : "Editar"}</button></div>
      ${R.edit === t.id ? `<div class="stn-edit"><div class="grid">
        <label class="field"><span>Hora</span>${cell(ev, "timeline", t, "hora", 'type="time"')}</label>
        <label class="field"><span>Duração (min)</span><input type="number" min="0" step="5" data-ev="${ev.id}" data-list="timeline" data-row="${t.id}" data-f="dur" value="${h(t.dur)}"></label>
        <label class="field"><span>Fase</span>${sel(ev, "timeline", t, "fase", FASES.map(f => [f,f]), "Fase")}</label>
        <label class="field"><span>Serviço</span>${sel(ev, "timeline", t, "mod", modOpts, "Serviço")}</label>
        <label class="field wide"><span>Momento</span>${cell(ev, "timeline", t, "acao", 'placeholder="O que acontece"')}</label>
        <label class="field"><span>Responsável</span>${cell(ev, "timeline", t, "resp")}</label>
        <label class="field"><span>Local</span>${cell(ev, "timeline", t, "local")}</label></div>
        <div class="spread"><span><button class="btn sm ghost danger" data-act="delRow" data-list="timeline" data-row="${t.id}">Remover paragem</button></span><button class="btn sm pri" data-act="editStn" data-row="${t.id}">Concluir</button></div></div>` : ""}
    </div>`;
  });
  const used = [...new Set(T.map(t => t.mod || ""))];
  const timed = T.filter(x => x.m !== null);
  return `${xbar("Timeline do dia", "A linha do dia por fases, com responsáveis e caixas para marcar no local.", [{k:"timeline", n:"Exportar timeline", ok:T.length > 0, falta:"Adiciona paragens"}])}
  <section class="panel">
    <div class="panel-h"><div><h2>Linha do dia${isToday ? " · hoje" : ""}</h2>${T.length ? `<span class="small muted">${T.length} paragens · ${done} concluídas${timed.length ? ` · ${fmtMin(timed[0].m)} → ${fmtMin(Math.max(...timed.map(x => x.m + num(x.dur))))}` : ""}</span>` : ""}</div>
      <div class="row"><button class="btn sm" data-act="genTimeline">Gerar a partir dos serviços</button><button class="btn sm pri" data-act="addRow" data-list="timeline">Adicionar paragem</button></div></div>
    ${T.length ? `<div class="row small muted" style="margin-bottom:10px;gap:14px">${used.map(k => `<span style="display:inline-flex;gap:6px;align-items:center">${lnb(k)}${h(LANES[k] || k)}</span>`).join("")}</div><div class="metro">${html}</div>`

  </section>`;
}

function fieldHTML(path, f, val, evId){
  const [k, n, type, opts] = f;
  const bind = evId ? `data-ev="${evId}" data-path="${path}"` : `name="${path}"`;
  const cls = type === "textarea" ? "field wide" : "field";
  if (type === "textarea") return `<label class="${cls}"><span>${n}</span><textarea ${bind}>${h(val)}</textarea></label>`;
  if (type === "select") return `<label class="${cls}"><span>${n}</span><select ${bind}><option value="">—</option>${opts.map(o => `<option ${val === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
  return `<label class="${cls}"><span>${n}</span><input ${type ? `type="${type}"` : ""} ${bind} value="${h(val)}"></label>`;
}

function chatBox(canal, title, sub){

function paintChat(){
  const el = $("#chatLog"); if (!el) return;
  if (!S.msgs.length){ el.innerHTML = `<p class="muted small" style="margin:auto">Ainda não há mensagens. Começa a conversa.</p>`; return; }
  let lastDay = "";
  el.innerHTML = S.msgs.map(m => { const d = new Date(m.ts), day = d.toLocaleDateString("pt-PT", {day:"numeric", month:"long"}), sep = day !== lastDay ? `<span class="ch-day">${h(day)}</span>` : ""; lastDay = day; const me = user && m.autorId === user.id;
    return sep + `<div class="msg ${me ? "me" : ""}"><span class="who">${me ? "Tu" : h(m.autor)} · ${d.toLocaleTimeString("pt-PT", {hour:"2-digit", minute:"2-digit"})}</span><div class="bub">${h(m.txt)}</div></div>`; }).join("");

/* ================= Contas (global) ================= */
function contas(){
  const E = evList().filter(e => e.estado !== "cancelado");
  const conf = E.filter(live), T = conf.map(totals), s = k => T.reduce((a,t) => a + t[k], 0);
  const rec = conf.map(e => ({...receivable(e), ev:e})).filter(r => r.falta > .005);
  const pay = conf.flatMap(payables).filter(x => x.falta > .005).sort((a,b) => (a.venc||"").localeCompare(b.venc||""));
  const pipe = E.filter(e => ["pedido","proposta"].includes(e.estado)).map(totals);
  return `<div class="head"><div><h1>Contas</h1><div class="muted">Eventos confirmados, realizados e fechados. Calculado a partir das propostas, das ordens de serviço e dos pagamentos registados.</div></div></div>
  <div class="stats">
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-res"}))}" class="stat"><span class="label">Faturação confirmada</span><b>${money(s("total"))}</b><span class="muted">com IVA</span><span class="go" aria-hidden="true">→</span></button>
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-rec"}))}" class="stat ${s("falta") > .005 ? "hl" : ""}"><span class="label">A receber</span><b>${money(s("falta"))}</b><span class="muted">${rec.filter(r => r.late).length} em atraso</span><span class="go" aria-hidden="true">→</span></button>
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-pag"}))}" class="stat"><span class="label">A pagar</span><b>${money(s("aPagar"))}</b><span class="muted">${pay.filter(x => x.venc && x.venc < today()).length} vencidos</span><span class="go" aria-hidden="true">→</span></button>
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-res"}))}" class="stat"><span class="label">Caixa do negócio</span><b class="${s("pago") - s("pagoF") < 0 ? "neg" : ""}">${money(s("pago") - s("pagoF"))}</b><span class="muted">recebido − pago</span><span class="go" aria-hidden="true">→</span></button>
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-res"}))}" class="stat"><span class="label">Margem</span><b>${money(s("margem"))}</b><span class="muted">${pct(s("sub") ? s("margem") / s("sub") : 0)} · em proposta: ${money(pipe.reduce((a,t) => a + t.margem, 0))}</span><span class="go" aria-hidden="true">→</span></button>
  </div>
  <div class="cols2">
    <section class="panel" id="sec-rec"><h2 style="margin-bottom:10px">A receber de clientes</h2>${rec.length ? `<div class="tw"><table><thead><tr><th>Cliente / evento</th><th>Próximo</th><th class="num">Em dívida</th></tr></thead><tbody>${rec.map(r => `<tr class="click ${r.late ? "late" : ""}" data-act="open" data-id="${r.ev.id}" data-tab="contas" tabindex="0"><td><b>${h(cli(r.ev).nome)}</b><div class="small muted">${h(r.ev.nome)} · ${dt(r.ev.data)}</div></td><td class="small">${r.next ? `${h(r.next.n)} até <span class="mono">${dt(r.next.d)}</span>${r.late ? ` <span class="chip s-bad">atraso</span>` : ""}` : ""}</td><td class="num mono">${money(r.falta)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Nada por receber.</p>`}</section>
    <section class="panel" id="sec-pag"><h2 style="margin-bottom:10px">A pagar a fornecedores</h2>${pay.length ? `<div class="tw"><table><thead><tr><th>Fornecedor / evento</th><th>Vence</th><th class="num">Falta</th></tr></thead><tbody>${pay.map(x => `<tr class="click ${x.venc && x.venc < today() ? "late" : ""}" data-act="open" data-id="${x.ev.id}" data-tab="contas" tabindex="0"><td><span style="display:inline-flex;gap:6px;align-items:center">${lnb(x.k)}<b>${h(x.nome)}</b></span><div class="small muted">${h(x.ev.nome)}</div></td><td class="mono small">${dt(x.venc)}</td><td class="num mono">${money(x.falta)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Nada por pagar.</p>`}</section>
  </div>
  <section class="panel" style="margin-top:16px" id="sec-res"><h2 style="margin-bottom:10px">Resultado por evento</h2><div class="tw"><table><thead><tr><th>Evento</th><th>Data</th><th class="num">Venda s/ IVA</th><th class="num">Custos</th><th class="num">Margem</th><th class="num">%</th><th class="num">Recebido</th><th class="num">Pago</th></tr></thead><tbody>
    ${conf.map(e => { const t = totals(e); return `<tr class="click" data-act="open" data-id="${e.id}" data-tab="contas" tabindex="0"><td><b>${h(e.nome)}</b><div class="small muted">${h(cli(e).nome)}</div></td><td class="mono">${dt(e.data)}</td><td class="num mono">${money(t.sub)}</td><td class="num mono">${money(t.custo)}</td><td class="num mono ${t.margem < 0 ? "neg" : "pos"}">${money(t.margem)}</td><td class="num">${pct(t.mpct)}</td><td class="num mono">${money(t.pago)}</td><td class="num mono">${money(t.pagoF)}</td></tr>`; }).join("") || `<tr><td colspan="8" class="muted">Sem eventos confirmados.</td></tr>`}
    </tbody>${conf.length ? `<tfoot><tr><td colspan="2">Total</td><td class="num mono">${money(s("sub"))}</td><td class="num mono">${money(s("custo"))}</td><td class="num mono">${money(s("margem"))}</td><td class="num">${pct(s("sub") ? s("margem") / s("sub") : 0)}</td><td class="num mono">${money(s("pago"))}</td><td class="num mono">${money(s("pagoF"))}</td></tr></tfoot>` : ""}</table></div></section>`;
}

const DRAFT_FORMS = ["evForm","cliForm","fornForm"];
const draftKey = id => "evt.draft." + id;
const draftable = () => !R.id && !R.fromPed && !R.prefill;
function saveDraft(f){ if (!f || !DRAFT_FORMS.includes(f.id) || !draftable()) return; const o = {}; for (const el of f.elements){ if (!el.name || el.type === "hidden" || el.type === "file") continue; o[el.name] = el.type === "checkbox" ? el.checked : el.value; } try { localStorage.setItem(draftKey(f.id), JSON.stringify({t:Date.now(), v:o})); } catch(e){} }
function clearDraft(id){ (id ? [id] : DRAFT_FORMS).forEach(k => { try { localStorage.removeItem(draftKey(k)); } catch(e){} }); }
function getDraft(id){ try { const d = JSON.parse(localStorage.getItem(draftKey(id)) || "null"); return d && Date.now() - d.t < 7 * 864e5 && Object.values(d.v || {}).some(v => v && v !== "0") ? d : null; } catch(e){ return null; } }
function draftNote(id){ return draftable() && getDraft(id) ? `<div class="draft-note"><span>↺ Recuperámos o que estavas a preencher.</span><button class="btn sm ghost" data-act="dropDraft">Começar do zero</button></div>` : ""; }

// Preenche um formulário por nome de campo; devolve quantos campos ficaram com valor
function fillForm(f, obj, mark){
  let n = 0;
  for (const [name, v] of Object.entries(obj)){
    const el = f.elements[name]; if (!el || el instanceof RadioNodeList || v === undefined || v === null) continue;
    if (el.type === "checkbox"){ if (el.checked !== !!v){ el.checked = !!v; el.dispatchEvent(new Event("change", {bubbles:true})); } if (v && mark){ el.closest("label")?.classList.add("ai-filled"); n++; } continue; }
    let val = String(v);
    if (el.tagName === "SELECT"){ const o = [...el.options].find(o => o.value === val) || [...el.options].find(o => o.text.trim().toLowerCase() === val.trim().toLowerCase()); if (!o) continue; val = o.value; }
    if (el.type === "date" && !/^\d{4}-\d{2}-\d{2}$/.test(val)) continue;
    if (el.type === "time"){ const m = /^(\d{1,2}):(\d{2})/.exec(val); if (!m) continue; val = m[1].padStart(2, "0") + ":" + m[2]; }
    if (el.type === "number"){ const x = parseFloat(val.replace(",", ".")); if (!isFinite(x)) continue; val = String(x); }
    el.value = val;
    if (el.value === val && val !== ""){ if (mark){ el.classList.add("ai-filled"); n++; } el.dispatchEvent(new Event("change", {bubbles:true})); }
  }
  return n;
}
function logoFromFile(file){
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type) || file.size > 8 * 1048576) return rej(new Error("tipo"));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("ler"));
    fr.onload = () => { const img = new Image(); img.onerror = () => rej(new Error("img")); img.onload = () => {
      const Z = 256, c = document.createElement("canvas"); c.width = c.height = Z; const x = c.getContext("2d");
      const nw = img.naturalWidth || Z, nh = img.naturalHeight || Z, r = Math.min(Z / nw, Z / nh), w = nw * r, hh = nh * r;
      x.drawImage(img, (Z - w) / 2, (Z - hh) / 2, w, hh);
      try { res(c.toDataURL("image/png")); } catch(e){ rej(e); } }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

  const p = tkProg(t), notes = tkNotes(t.id), canDel = t.criadoPor === user.id || M(), vis = R.nvis || "geral";
  const evs = evList().filter(e => !["fechado","cancelado"].includes(e.estado) || e.id === t.eventoId);
  return `<div class="crumbs"><a href="#" data-act="go" data-v="tarefas">Tarefas</a> › ${h(t.titulo)}</div>
  <div class="head tk-head"><div style="flex:1;min-width:0"><input class="tk-title" data-tk="titulo" data-id="${t.id}" value="${h(t.titulo)}" aria-label="Título da tarefa" maxlength="200">
    <div class="muted small">Criada por ${h(t.criadoPorNome || tkUser(t.criadoPor)?.nome || "—")} · ${dt(t.criado)}</div></div>
    ${canDel ? `<span><button class="btn ghost danger" data-act="askDelTask" data-id="${t.id}">Apagar</button></span>` : ""}</div>
  <div class="seg tk-est" role="group" aria-label="Estado">${TK_EST.map(([k, n]) => `<button data-act="tkEstado" data-id="${t.id}" data-k="${k}" aria-pressed="${t.estado === k}">${n}</button>`).join("")}</div>
  <div class="cols tk-cols">
    <div class="stack">
      <section class="panel"><div class="grid">
        <label class="field"><span>Responsável</span><select data-tk="responsavel" data-id="${t.id}"><option value="">— ninguém —</option>${tkUsers().map(u => `<option value="${h(u.id)}" ${t.responsavel === u.id ? "selected" : ""}>${h(u.nome)} · ${h(u.role)}</option>`).join("")}</select></label>
        <label class="field"><span>Prazo</span><input type="date" data-tk="prazo" data-id="${t.id}" value="${h(t.prazo)}"></label>
        <label class="field"><span>Prioridade</span><select data-tk="prioridade" data-id="${t.id}">${TK_PRI.map(([k, n]) => `<option value="${k}" ${(t.prioridade || "normal") === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <label class="field"><span>Evento (opcional)</span><select data-tk="eventoId" data-id="${t.id}"><option value="">— nenhum —</option>${evs.map(e => `<option value="${e.id}" ${t.eventoId === e.id ? "selected" : ""}>${h(e.nome)} · ${dt(e.data)}</option>`).join("")}</select></label>
        <label class="field wide"><span>Descrição</span><textarea data-tk="descricao" data-id="${t.id}" placeholder="O que é preciso fazer, contexto, links…">${h(t.descricao)}</textarea></label>
      </div>${t.eventoId && S.eventos[t.eventoId] ? `<button class="btn sm" style="margin-top:12px" data-act="open" data-id="${t.eventoId}">Abrir o evento →</button>` : ""}</section>
      <section class="panel" id="sec-ck"><div class="panel-h"><div><h2>Lista de verificação</h2><span class="small muted">${p.n ? `${p.ok} de ${p.n} feitos` : "Divide a tarefa em passos pequenos."}</span></div></div>
        ${p.n ? `<div class="tk-bar" aria-hidden="true"><i style="width:${Math.round(p.ok / p.n * 100)}%"></i></div>` : ""}
        <ul class="ck-list">${(t.checklist || []).map(c => `<li class="${c.feito ? "done" : ""}"><input type="checkbox" data-ck="${t.id}" data-row="${c.id}" ${c.feito ? "checked" : ""} aria-label="Feito"><input class="ck-txt" data-ckt="${t.id}" data-row="${c.id}" value="${h(c.txt)}" aria-label="Passo">${c.feito && c.por ? `<span class="ck-by" title="Feito por ${h(c.por)}">✓ ${h(String(c.por).split(" ")[0])}</span>` : ""}<button class="btn ghost sm" data-act="delCk" data-id="${t.id}" data-row="${c.id}" aria-label="Apagar passo">×</button></li>`).join("")}</ul>
        <form class="ck-add" id="ckForm" data-id="${t.id}" autocomplete="off"><input id="ckIn" placeholder="Adicionar passo… (Enter)" aria-label="Novo passo" maxlength="300"><button class="btn sm" type="submit">Adicionar</button></form>
      </section>
    </div>
    <section class="panel" id="sec-notas"><div class="panel-h"><div><h2>Notas</h2><span class="small muted">As gerais são vistas por toda a equipa. As privadas só por ti.</span></div></div>
      <form class="note-form" id="noteForm" data-id="${t.id}">
        <textarea id="noteIn" placeholder="${vis === "privada" ? "Nota privada: só tu a vais ver…" : "Nota para a equipa…"}" aria-label="Texto da nota"></textarea>
        <div class="row" style="justify-content:space-between"><div class="seg" role="group" aria-label="Visibilidade da nota"><button type="button" data-act="noteVis" data-k="geral" aria-pressed="${vis === "geral"}">👥 Geral</button><button type="button" data-act="noteVis" data-k="privada" aria-pressed="${vis === "privada"}">🔒 Privada</button></div><button class="btn pri sm" type="submit">Guardar nota</button></div>
      </form>
      <div class="notes">${notes.length ? notes.map(n => `<article class="note ${n.privada ? "priv" : ""}"><header><span class="tk-av sm">${h(initials(n.autor))}</span><b>${h(n.autor)}</b><span class="muted small">${new Date(n.ts).toLocaleString("pt-PT", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})}</span>${n.privada ? `<span class="chip note-lock">🔒 Privada · só tu vês</span>` : ""}${n.autorId === user.id ? `<span style="margin-left:auto"><button class="btn ghost sm danger" data-act="delNote" data-id="${n.id}" aria-label="Apagar nota">Apagar</button></span>` : ""}</header><p>${h(n.txt)}</p></article>`).join("") : `<p class="muted small">Ainda não há notas.</p>`}</div>
    </section>
  </div>`;
}
function evTasksPanel(ev){
  const L = Object.values(S.tarefas).filter(t => t.eventoId === ev.id).sort((a, b) => (a.estado === "feita") - (b.estado === "feita"));
  return `<section class="panel"><div class="panel-h"><div><h2>Tarefas da equipa</h2><span class="small muted">${L.filter(t => t.estado !== "feita").length} abertas</span></div><div class="row"><button class="btn sm" data-act="evNewTask" data-id="${ev.id}">${ico("plus")}Nova tarefa</button>${L.length ? `<button class="btn ghost sm" data-act="goJ" data-j="${h(JSON.stringify({v:"tarefas", f:"todas", ev:ev.id}))}">Ver todas</button>` : ""}</div></div>
    ${L.length ? `<div class="tk-list">${L.slice(0, 6).map(tkCard).join("")}</div>` : `<p class="muted small">Sem tarefas ligadas a este evento.</p>`}</section>`;
}
Object.assign(ACT, {
  tkEstado: b => { mutTk(b.dataset.id, t => { t.estado = b.dataset.k; t.feitaEm = b.dataset.k === "feita" ? new Date().toISOString() : ""; }); render(); },
  delCk: b => { mutTk(b.dataset.id, t => { t.checklist = (t.checklist || []).filter(c => c.id !== b.dataset.row); }); render(); },
  noteVis: b => { R.nvis = b.dataset.k; const t = $("#noteIn"); const keep = t?.value || ""; render(); const n = $("#noteIn"); if (n){ n.value = keep; n.focus(); } },
  delNote: b => { del("notas", b.dataset.id); render(); toast("Nota apagada."); },
  askDelTask: b => { b.parentElement.innerHTML = `<span class="confirm">Apagar a tarefa e as notas? <button class="btn sm danger" data-act="doDelTask" data-id="${b.dataset.id}">Apagar</button><button class="btn sm ghost" data-act="noDel">Não</button></span>`; },
  doDelTask: b => { const id = b.dataset.id; Object.values(S.notas).filter(n => n.tarefaId === id && (!n.privada || n.autorId === user.id)).forEach(n => del("notas", n.id)); del("tarefas", id); go({v:"tarefas"}); toast("Tarefa apagada."); },
  evNewTask: b => { const ev = S.eventos[b.dataset.id]; const id = newTask("Nova tarefa · " + (ev?.nome || ""), {eventoId:b.dataset.id}); go({v:"tarefa", id}); setTimeout(() => { const i = $(".tk-title"); i?.focus(); i?.select(); }, 30); }
});
document.addEventListener("change", e => {
  const el = e.target, d = el.dataset;
  if (d.tkdone){ mutTk(d.tkdone, t => { t.estado = el.checked ? "feita" : "afazer"; t.feitaEm = el.checked ? new Date().toISOString() : ""; }); toast(el.checked ? "Tarefa feita. ✓" : "Tarefa reaberta."); schedule(); return; }
  if (d.tk){ const v = el.value; if (d.tk === "titulo" && !v.trim()){ render(); return; } mutTk(d.id, t => { t[d.tk] = d.tk === "titulo" ? v.trim().slice(0, 200) : v; }); schedule(); return; }
  if (d.ck){ mutTk(d.ck, t => { const c = (t.checklist || []).find(x => x.id === d.row); if (c){ c.feito = el.checked; c.por = el.checked ? user.nome : ""; } }); schedule(); return; }
  if (d.ckt){ mutTk(d.ckt, t => { const c = (t.checklist || []).find(x => x.id === d.row); if (c && el.value.trim()) c.txt = el.value.trim().slice(0, 300); }); schedule(); return; }
});
document.addEventListener("submit", e => {
  const f = e.target;
  if (f.id === "tkQuick"){ e.preventDefault(); e.stopImmediatePropagation(); const i = $("#tkQuickIn"), v = i.value.trim(); if (!v) return; newTask(v, R.ev ? {eventoId:R.ev} : {}); i.value = ""; render(); setTimeout(() => $("#tkQuickIn")?.focus(), 0); toast("Tarefa criada."); return; }
  if (f.id === "ckForm"){ e.preventDefault(); e.stopImmediatePropagation(); const i = $("#ckIn"), v = i.value.trim(); if (!v) return; mutTk(f.dataset.id, t => { t.checklist = [...(t.checklist || []), {id:uid("c"), txt:v.slice(0, 300), feito:false}]; }); render(); setTimeout(() => $("#ckIn")?.focus(), 0); return; }
  if (f.id === "noteForm"){ e.preventDefault(); e.stopImmediatePropagation(); const i = $("#noteIn"), v = i.value.trim(); if (!v) return; const id = uid("n"); put("notas", id, {id, tarefaId:f.dataset.id, txt:v.slice(0, 4000), autorId:user.id, autor:user.nome, ts:Date.now(), privada:(R.nvis || "geral") === "privada"}); render(); toast((R.nvis || "geral") === "privada" ? "Nota privada guardada. Só tu a vês." : "Nota guardada para a equipa."); return; }
}, true);

render();
initStore();
initAssets();
initAI();
})();
</script>
</body></html>
