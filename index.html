<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Organização de eventos: jantares de empresa, aniversários, batizados e festas, com proposta de preço fechado numa semana."><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Serão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: website público (convite + linha de metro como motivo) → área de staff com régua lateral; cada evento é um dossier com separadores que exportam o seu documento */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#E8EAE4; --ink:#1C2320; --muted:#5D6661; --line:#D3D8D0;
  --accent:#8A2D4B; --accent-ink:#FFFFFF; --accent-soft:#F4E4EA; --brass:#9A7430;
  --good:#2E6A4E; --good-soft:#E1EFE7; --warn:#93600F; --warn-soft:#F6ECD9; --bad:#A3332B; --bad-soft:#F7E2DF;
  --m-geral:#6B7480; --m-cliente:#475569; --m-espaco:#2563C9; --m-catering:#E0632B; --m-material:#7C4DDB; --m-alojamento:#0E9A80; --m-transporte:#C99200; --m-animacao:#D63A72;
  --ph-montagem:#8A938D; --ph-evento:#8A2D4B; --ph-desmontagem:#8A938D;
  --paper:#FFFDF9; --paper-ink:#1D1F1E; --paper-muted:#666B68; --paper-line:#DCDFDB; --paper-accent:#8A2D4B; --paper-soft:#F6EEF1;
  --hero:#1E2A26; --hero-ink:#F3F1EA; --hero-muted:#AEB8B2; --on-brass:#1E2A26; --hero-line:rgba(243,241,234,.25); --hero-em:var(--brass);
  --scrim:rgba(18,22,20,.55);
  --f-display:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-serif:"Instrument Serif", Georgia, serif;
  --r:6px;
}
/* Modo escuro: só na área de staff, por preferência de cada pessoa (classe .dark no html) */
html.dark{
  --bg:#131715; --surface:#1B201D; --sunk:#242a26; --ink:#E6EAE6; --muted:#9BA49E; --line:#333B36;
  --accent:#D9809E; --accent-ink:#1C0D13; --accent-soft:#3A2029; --brass:#D4AE68;
  --good:#7FC6A1; --good-soft:#1E3329; --warn:#E3B562; --warn-soft:#3A2F18; --bad:#EC8A80; --bad-soft:#3D2220;
  --m-geral:#9AA39D; --m-cliente:#B9C2BC; --m-espaco:#7BA7D9; --m-catering:#E38B63; --m-material:#AE94D6; --m-alojamento:#6CC1AA; --m-transporte:#D6B54E; --m-animacao:#E27AA3;
  --ph-montagem:#6B746E; --ph-evento:#D9809E; --ph-desmontagem:#6B746E;
  --paper:#F7F4EE; --hero:#0E1311; --hero-ink:#F3F1EA; --hero-muted:#93A099;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.15rem}h3{font-size:1rem;font-weight:600}
p{margin:0}
.mono,.ref{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.pos{color:var(--good)}.neg{color:var(--bad)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* ---------- Website público ---------- */
.site{background:var(--bg);min-height:100%}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.s-top{background:var(--hero);color:var(--hero-ink)}
.s-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;flex-wrap:wrap}
.s-logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.s-logo .mark{background:var(--brass);color:var(--on-brass)}
.s-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.s-links button{all:unset;cursor:pointer;padding:8px 12px;border-radius:999px;color:var(--hero-muted);font-weight:500}
.s-links button:hover{color:var(--hero-ink)}
.s-links button:focus-visible{outline:2px solid var(--brass)}
.s-staff{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--hero-line);color:var(--hero-ink);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.88rem}
.s-staff:hover{background:var(--hero-line)}
.s-staff:focus-visible{outline:2px solid var(--brass)}
.s-staff svg{width:14px;height:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);gap:48px;align-items:center;padding-block:28px 80px}
.eyebrow{display:inline-flex;gap:10px;align-items:center;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-em);font-weight:600}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.hero h1{font-size:clamp(2.3rem,5.4vw,4.1rem);line-height:1.02;font-weight:800;letter-spacing:-.03em;margin:18px 0 20px;color:var(--hero-ink)}
.hero h1 em{font-style:normal;color:var(--hero-em)}
.hero p.lead{font-size:1.08rem;color:var(--hero-muted);max-width:52ch;line-height:1.6}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.b-brass{all:unset;cursor:pointer;background:var(--brass);color:var(--on-brass);font-weight:700;padding:12px 22px;border-radius:999px}
.b-brass:hover{filter:brightness(1.08)}
.b-line{all:unset;cursor:pointer;border:1px solid var(--hero-line);color:var(--hero-ink);font-weight:600;padding:11px 22px;border-radius:999px}
.b-brass:focus-visible,.b-line:focus-visible{outline:2px solid var(--hero-ink);outline-offset:3px}
.invite{border:1px solid var(--hero-line);background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:10px;transform:rotate(1.4deg);box-shadow:0 30px 60px -30px rgba(0,0,0,.6);max-width:380px;justify-self:end;width:100%}
.invite-in{border:1px solid #CDBF9F;outline:1px solid #CDBF9F;outline-offset:-6px;padding:26px 26px 22px}
.invite .k{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#9A7430;font-weight:600;text-align:center}
.invite h3{font-size:1.45rem;text-align:center;margin:6px 0 2px;color:#1D1F1E}
.invite .d{text-align:center;font-size:.82rem;color:#666B68;margin-bottom:18px}
.mini-metro{display:grid;gap:0;margin:0 auto;max-width:250px}
.mini-metro div{display:grid;grid-template-columns:46px 18px 1fr;align-items:center;min-height:34px;position:relative}
.mini-metro .t{font-family:var(--f-mono);font-size:.78rem;color:#666B68}
.mini-metro i{width:12px;height:12px;border-radius:50%;background:#FFFDF9;border:3px solid var(--paper-accent);justify-self:center;position:relative;z-index:1}
.mini-metro div::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:4px;background:var(--paper-accent);border-radius:2px}
.mini-metro div:first-child::before{top:50%}.mini-metro div:last-child::before{bottom:50%}
.mini-metro span{font-weight:600;font-size:.92rem;color:#1D1F1E;padding-left:8px}
.invite .sig{text-align:center;font-family:var(--f-display);font-size:.8rem;color:#9A7430;margin-top:16px;letter-spacing:.06em}
.types{border-top:1px solid var(--hero-line);padding-block:18px;display:flex;gap:10px 26px;flex-wrap:wrap;color:var(--hero-muted);font-size:.9rem}
.types b{color:var(--hero-ink);font-weight:500}
.s-sec{padding-block:72px}
.s-sec+.s-sec{border-top:1px solid var(--line)}
.s-h{display:grid;gap:10px;max-width:640px;margin-bottom:36px}
.s-h .eyebrow{color:var(--accent)}
.s-h h2{font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.1;letter-spacing:-.02em;font-weight:800}
.s-h p{color:var(--muted);font-size:1.02rem;line-height:1.6}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.svc div{background:var(--surface);padding:24px 22px;display:grid;gap:8px;align-content:start}
.svc .ln{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.svc .ln i{width:22px;height:6px;border-radius:3px;background:var(--c)}
.svc h3{font-size:1.15rem}
.svc p{color:var(--muted);line-height:1.55}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative}
.how::before{content:"";position:absolute;left:12.5%;right:12.5%;top:21px;height:6px;border-radius:3px;background:var(--accent)}
.how div{display:grid;align-content:start;justify-items:center;text-align:center;gap:10px;padding:0 14px;position:relative}
.how i{width:48px;height:48px;border-radius:50%;background:var(--surface);border:6px solid var(--accent);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-weight:500;font-size:.85rem;z-index:1}
.how b{font-family:var(--f-display);font-size:1.08rem}
.how p{color:var(--muted);font-size:.92rem;line-height:1.5;max-width:28ch}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.about blockquote{margin:0;font-family:var(--f-display);font-size:clamp(1.3rem,2.4vw,1.75rem);line-height:1.3;letter-spacing:-.01em;font-weight:600;border-left:4px solid var(--brass);padding-left:22px}
.about .facts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.about .facts b{display:block;font-family:var(--f-display);font-size:1.6rem}
.about .facts span{color:var(--muted);font-size:.88rem}
.req{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:40px;align-items:start}
.req-form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px;display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chips input{width:auto;accent-color:var(--accent)}
.contact-list{display:grid;gap:14px;margin-top:22px}
.contact-list div{display:grid;gap:2px}
.contact-list b{font-weight:600}
.done-card{background:var(--surface);border:1px solid var(--good);border-radius:12px;padding:28px;display:grid;gap:12px}
.s-foot{background:var(--hero);color:var(--hero-muted);padding-block:30px;font-size:.88rem}
.s-foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.preview-bar{background:var(--accent);color:var(--accent-ink);padding-block:8px;font-size:.88rem}
.preview-bar .wrap{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.preview-bar button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--hero)}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.1rem;display:block;line-height:1.2}
.err{color:var(--bad);font-size:.85rem}

/* ---------- App ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;padding-left:max(14px,env(safe-area-inset-left,0px))}
.nav{display:grid;gap:2px}
.nav .grp{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:var(--r);display:flex;justify-content:space-between;align-items:center;font-weight:500}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.nav .count.hot{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px}
.who{margin-top:auto;display:grid;gap:8px;font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}
.main{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;max-width:1220px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.crumbs{font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.crumbs button{all:unset;cursor:pointer;color:var(--accent)}
.crumbs button:hover{text-decoration:underline}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0;cursor:pointer}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:grid;gap:4px;align-content:start}
.field>span{font-size:.8rem;font-weight:500;color:var(--muted)}
.grid{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid .wide{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:auto}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.stack>*+*{margin-top:16px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.cols2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.45rem;font-variant-numeric:tabular-nums}
.stat.hl{border-color:var(--accent)}
button.stat{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;width:100%;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
button.stat:hover{transform:translateY(-2px);border-color:var(--sc,var(--accent));box-shadow:0 8px 20px -12px var(--sc,var(--accent))}
button.stat:active{transform:translateY(0)}
button.stat .label{padding-right:22px}
button.stat:focus-visible{outline:2px solid var(--sc,var(--accent));outline-offset:2px}
.stat .go{position:absolute;top:12px;right:14px;font-size:.95rem;color:var(--sc,var(--accent));opacity:.45;transition:opacity .15s, transform .15s}
button.stat:hover .go,button.stat:focus-visible .go{opacity:1;transform:translateX(3px)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){button.stat,.stat .go{transition:none}button.stat:hover{transform:none}.flash{animation:none;outline:2px solid var(--accent)}}

.xbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:8px;padding:10px 12px;margin-bottom:16px}
.xbar .what{display:grid;line-height:1.3}
.xbar .what b{font-weight:600}
.xbar .what span{font-size:.82rem;color:var(--muted)}

.tw{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:right}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.ed td{padding:4px 4px}
.ed input:not([type=checkbox]),.ed select{padding:5px 7px;border-color:transparent;background:transparent}
.ed input:not([type=checkbox]):hover,.ed select:hover{border-color:var(--line)}
.ed input:focus,.ed select:focus{background:var(--surface)}
tfoot td{border-bottom:none;font-weight:600}
tr.done td{opacity:.55}
tr.late td{background:var(--bad-soft)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-pedido{background:var(--sunk);color:var(--muted)}
.s-proposta,.s-warn,.s-novo{background:var(--warn-soft);color:var(--warn)}
.s-confirmado,.s-analise{background:var(--accent-soft);color:var(--accent)}
.s-realizado,.s-fechado,.s-ok,.s-convertido{background:var(--good-soft);color:var(--good)}
.s-cancelado,.s-bad,.s-recusado{background:var(--bad-soft);color:var(--bad)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.lnb{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:18px;padding:0 6px;border-radius:4px;font-size:.66rem;font-weight:700;letter-spacing:.04em;color:var(--surface);background:var(--c)}

.pipe{display:flex;overflow-x:auto;margin:4px 0 18px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pipe button{all:unset;cursor:pointer;flex:1 0 auto;padding:9px 14px;font-size:.82rem;font-weight:500;color:var(--muted);border-right:1px solid var(--line);text-align:center;white-space:nowrap}
.pipe button:last-child{border-right:none}
.pipe button.done{color:var(--ink)}
.pipe button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.pipe button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:.82rem;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.on.ok{background:var(--good);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tabs .badge{font-family:var(--f-mono);font-size:.7rem;background:var(--sunk);border-radius:999px;padding:0 6px;color:var(--muted)}
.tabs .badge.w{background:var(--warn-soft);color:var(--warn)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.meter{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.ok i{background:var(--good)}
.prog{display:grid;gap:12px}.prog>div{display:grid;gap:4px}

/* Linha de metro (timeline) */
.metro{display:grid;gap:0}
.zone{display:grid;grid-template-columns:92px 44px 1fr;align-items:center;min-height:44px}
.zone .zl{grid-column:3;display:inline-flex;gap:8px;align-items:center;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.zone .zl::after{content:"";flex:1;height:1px;background:var(--line);min-width:30px}
.zone .rail{grid-column:2;grid-row:1;justify-self:center;width:8px;align-self:stretch;background:var(--pc)}
.zone.first .rail{border-radius:4px 4px 0 0;margin-top:18px}
.stn{display:grid;grid-template-columns:92px 44px minmax(0,1fr) auto;gap:0;min-height:64px;position:relative}
.stn .tm{grid-column:1;grid-row:1;text-align:right;padding:12px 14px 0 0;font-family:var(--f-mono);font-weight:500;font-size:1rem;line-height:1.2}
.stn .tm small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.stn .rl{position:relative;display:flex;justify-content:center;grid-column:2;grid-row:1 / span 3}
.stn .rl::before{content:"";position:absolute;top:0;bottom:0;width:8px;background:var(--pc)}
.stn.last .rl::before{bottom:auto;height:24px;border-radius:0 0 4px 4px}
.stn .dot{position:relative;margin-top:12px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:5px solid var(--c);z-index:1;box-sizing:border-box;flex:none}
.stn.done .dot{background:var(--c)}
.stn.next .dot{width:26px;height:26px;margin-top:10px;box-shadow:0 0 0 5px var(--accent-soft)}
.stn .bd{grid-column:3;grid-row:1;padding:10px 0 14px 4px;min-width:0}
.stn .ttl{font-weight:600;font-size:1rem;line-height:1.3}
.stn.done .ttl{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.stn .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:5px;font-size:.82rem;color:var(--muted)}
.stn .act{grid-column:4;grid-row:1;display:flex;gap:6px;align-items:flex-start;padding-top:10px}
.stn.next .ttl::after{content:"A seguir";margin-left:8px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:999px;vertical-align:middle}
.stn-edit{grid-column:3 / -1;grid-row:2;background:var(--sunk);border-radius:8px;padding:14px;margin:4px 0 14px;display:grid;gap:12px}
@media (prefers-reduced-motion:no-preference){.stn.next .dot{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 9px var(--accent-soft)}}}

/* OS */
.os{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.os+.os{margin-top:16px}
.os-h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);border-left:5px solid var(--c)}
.os-h h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.os-h h2 small{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:400}
.os-b{padding:16px 18px;display:grid;gap:18px}
.os-cols{display:grid;gap:18px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.sched{display:grid;border-left:4px solid var(--c);margin-left:6px}
.sched div{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:5px 0 5px 14px;position:relative;font-size:.88rem}
.sched div::before{content:"";position:absolute;left:-9px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--c);box-sizing:border-box}
.sched .t{font-family:var(--f-mono);color:var(--muted)}
.sub-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.money-box{background:var(--sunk);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.money-box .r{display:flex;justify-content:space-between;gap:10px}
.money-box .r b{font-variant-numeric:tabular-nums}

/* Catálogo */
.picker{border:1px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:14px;background:var(--surface)}
.pick-list{max-height:360px;overflow:auto;margin-top:10px;border-top:1px solid var(--line)}
.pick-g{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 4px 4px;display:flex;gap:8px;align-items:center}
.pick-i{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.9rem}

/* Chat */
.chat{display:grid;grid-template-columns:240px minmax(0,1fr);border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;min-height:520px}
.chat.single{grid-template-columns:1fr}
.ch-list{border-right:1px solid var(--line);padding:10px;display:grid;gap:2px;align-content:start;overflow-y:auto;max-height:640px}
.ch-list button{all:unset;cursor:pointer;padding:8px 10px;border-radius:var(--r);display:grid;gap:1px}
.ch-list button:hover{background:var(--sunk)}
.ch-list button[aria-current="true"]{background:var(--accent-soft)}
.ch-list button:focus-visible{outline:2px solid var(--accent)}
.ch-list b{font-weight:600;font-size:.9rem}
.ch-list span{font-size:.75rem;color:var(--muted)}
.ch-main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:520px;max-height:72vh}
.ch-top{padding:12px 16px;border-bottom:1px solid var(--line)}
.ch-log{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(75%,560px);display:grid;gap:2px}
.msg .who{font-size:.75rem;color:var(--muted);margin:0;border:0;padding:0}
.msg .bub{background:var(--sunk);padding:8px 12px;border-radius:12px 12px 12px 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;text-align:right}
.msg.me .bub{background:var(--accent);color:var(--accent-ink);border-radius:12px 12px 4px 12px;text-align:left}
.ch-day{align-self:center;font-size:.72rem;color:var(--muted);background:var(--sunk);padding:2px 10px;border-radius:999px}
.ch-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.ch-form textarea{min-height:42px;height:42px;resize:none}

.fs{border-top:1px solid var(--line);padding-top:18px;margin-top:18px;display:grid;gap:12px}
.fs:first-child{border-top:none;padding-top:0;margin-top:0}
.fs-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fs-h .n{font-family:var(--f-mono);font-size:.78rem;color:var(--accent)}
.mods{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.mod{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mod:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.modbox{border:1px dashed var(--line);border-radius:8px;padding:14px;display:grid;gap:12px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.attn{display:grid;gap:8px}
.attn div{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.dot2{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.dot2.w{background:var(--warn)}.dot2.b{background:var(--bad)}.dot2.g{background:var(--good)}
.req-card{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px 18px;display:grid;gap:10px}
.req-card+.req-card{margin-top:12px}
/* Mais cor */
.side{background:linear-gradient(180deg,var(--accent-soft) 0,var(--surface) 260px)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav button[aria-current="page"] .count{color:var(--accent-ink)}
.nav .count.hot{background:var(--brass);color:var(--on-brass)}
.stat{border-top:4px solid var(--sc,var(--accent))}
.stats .stat:nth-child(5n+1){--sc:var(--accent)}.stats .stat:nth-child(5n+2){--sc:var(--m-espaco)}.stats .stat:nth-child(5n+3){--sc:var(--m-alojamento)}.stats .stat:nth-child(5n+4){--sc:var(--m-catering)}.stats .stat:nth-child(5n){--sc:var(--brass)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-width:3px}
.pipe button.done{background:var(--accent-soft);color:var(--accent)}
.xbar{background:linear-gradient(90deg,var(--accent-soft),var(--sunk));border-left:4px solid var(--accent)}
.svc div{border-top:4px solid var(--c)}
.hello{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:24px 26px 30px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px;position:relative;overflow:hidden}
.hello>*{position:relative;z-index:1}
.hello h1{color:var(--hero-ink);font-size:1.9rem;font-weight:800}
.hello .label{color:var(--hero-em)}
.hello p{color:var(--hero-muted);margin-top:4px}
.hello::before{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--accent),var(--brass))}
html.dark .hello{border:1px solid var(--line)}
.mode-btn{display:inline-flex;gap:6px;align-items:center}
html.dark .side{background:var(--surface)}
.pal-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pal{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;background:var(--surface)}
.pal:hover{border-color:var(--muted)}
.pal[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pal:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pal-top{height:72px;padding:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.pal-top b{font-family:var(--f-display);font-size:.95rem;font-weight:700}
.pal-top i{display:inline-block;white-space:nowrap;flex:none;padding:4px 10px;border-radius:999px;font-style:normal;font-size:.72rem;font-weight:700}
.pal-sw{display:flex;height:14px}.pal-sw span{flex:1}
.pal-ft{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem}
.pal-ft .chip{font-size:.7rem}
.logo{display:block;flex:none;width:34px;height:34px}
.logo svg,.s-logo svg{display:block;width:100%;height:100%}
.s-logo .logo{width:38px;height:38px}
.wm{font-family:var(--f-display);letter-spacing:-.01em;line-height:1.1}
.wm .wm-s{font-weight:500;opacity:.78}
.wm .wm-g{font-weight:700}
.s-top{position:relative;overflow:hidden}
.s-top .wrap{position:relative;z-index:1}
.garland{display:block;width:100%;height:70px;pointer-events:none}
.garland .w{fill:none;stroke:var(--hero-ink);stroke-opacity:.3;stroke-width:1.2}
.garland .g{fill:var(--brass);opacity:.16}
.garland .l{fill:var(--brass)}
@media (prefers-reduced-motion:no-preference){.garland .g{animation:glow 3.2s ease-in-out infinite}.garland .g:nth-of-type(3n){animation-delay:1.1s}.garland .g:nth-of-type(3n+1){animation-delay:2.1s}@keyframes glow{50%{opacity:.34}}}
.moments{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.mom{margin:0;display:grid;gap:12px;align-content:start}
.mom svg{width:100%;height:auto;display:block;border-radius:12px;aspect-ratio:400/250;max-width:100%}
.mom figcaption b{font-family:var(--f-display);font-size:1.02rem;display:block;margin-bottom:2px}
.mom figcaption span{color:var(--muted);font-size:.9rem;line-height:1.5}
.il .h{fill:var(--hero)}.il .a{fill:var(--accent)}.il .b{fill:var(--brass)}.il .p{fill:var(--paper)}.il .i{fill:var(--hero-ink)}.il .s{fill:var(--accent-soft)}
.il .ln{fill:none;stroke:var(--hero-ink);stroke-opacity:.4;stroke-width:1.5}
@media (max-width:900px){.moments{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.moments{grid-template-columns:1fr}}
.pwr{display:inline-grid;justify-items:center;align-content:center;gap:3px;font-size:.66rem;letter-spacing:.08em;color:inherit;opacity:.8;white-space:nowrap;line-height:1.2}
.pwr b{font-family:var(--f-display);font-weight:500;font-size:.82rem;letter-spacing:.34em;text-transform:uppercase;display:inline-flex;align-items:center;gap:7px;margin-right:-.34em}
.pwr b::before,.pwr b::after{content:"";width:14px;height:1px;background:currentColor}
.files{display:grid;gap:8px}
.file{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.file .ic{width:44px;height:44px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.68rem;font-weight:700;letter-spacing:.06em;overflow:hidden}
.file .ic img{width:100%;height:100%;object-fit:cover;display:block}
.file .nm{min-width:0}
.file .nm a{font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.file .nm a:hover{color:var(--accent);text-decoration:underline}
.file .nm small{display:block;color:var(--muted);font-size:.78rem}
.file.old{border-color:var(--warn)}
.file .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.file .act input{width:150px}
a.btn{text-decoration:none;color:inherit}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pal-grp{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:6px 0 10px}
.pal-grp+.pal-grid{margin-bottom:18px}
.pal-custom{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pal-custom label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500}
.pal-custom input[type=color]{width:64px;height:38px;padding:2px;cursor:pointer}
.req-card.novo{border-left:5px solid var(--warn)}

.modal{position:fixed;inset:0;background:var(--scrim);z-index:50;overflow:auto;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal-bar{max-width:840px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.modal-bar .t{font-weight:600;color:#fff}
.paperwrap{max-width:840px;margin:0 auto;overflow-x:auto;border-radius:4px}
.paper{background:#fff;color:#1D1F1E;min-width:600px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:60;font-size:.88rem;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:6px;align-items:center;background:var(--bad-soft);padding:4px 8px;border-radius:var(--r);font-size:.85rem;color:var(--bad);flex-wrap:wrap}

@media (max-width:1180px){.cols2{grid-template-columns:1fr}}
@media (max-width:900px){
  .hero,.about,.req{grid-template-columns:1fr}
  .invite{justify-self:center;transform:rotate(0)}
  .svc{grid-template-columns:1fr 1fr}
  .how{grid-template-columns:1fr 1fr;row-gap:28px}
  .how::before{display:none}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;border-right:none;border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .side .brand small{display:none}
  .nav{display:flex;overflow-x:auto;width:100%;order:3}
  .nav .grp{display:none}
  .nav button{white-space:nowrap;flex:none}
  .who{margin:0 0 0 auto;border:none;padding:0;display:flex;align-items:center}
  .who>span .muted{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cols,.cols2,.os-cols{grid-template-columns:1fr}
  .chat{grid-template-columns:1fr}
  .ch-list{border-right:none;border-bottom:1px solid var(--line);grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;max-height:none}
  .stn{grid-template-columns:62px 36px minmax(0,1fr)}
  .zone{grid-template-columns:62px 36px 1fr}
  .stn .tm{font-size:.88rem;padding-right:8px}
  .stn .act{grid-column:3;grid-row:2;padding:0 0 12px 4px}
  .stn-edit{grid-row:3}
}
@media (max-width:520px){.svc,.how,.about .facts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.btn,.nav button,tr.click td{transition:background-color .12s,border-color .12s}}

/* =========== Linguagem FERRO: Geist + itálico serifado, pílulas, rótulos mono, grelha e brilho =========== */
body{font-size:14.5px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;letter-spacing:-.025em}
h1{font-size:1.75rem;font-weight:500;letter-spacing:-.035em}
.it{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:0}
.label,th,.nav .grp,.pick-g,.zone .zl,.svc .ln,.pal-grp{font-family:var(--f-mono);font-weight:500;letter-spacing:.08em}
.btn{border-radius:999px;padding:8px 16px}
.btn.sm{padding:5px 12px}
.btn.ghost{padding-inline:10px}
.seg{border-radius:999px}
input,select,textarea{border-radius:10px}
.panel,.os,.req-card,.chat,.picker,.pal,.stat{border-radius:18px}
.panel{padding:20px}
.xbar{border-radius:14px}
.empty{border-radius:18px}
.nav button{border-radius:10px}
.stat b{font-weight:500;font-size:1.75rem;letter-spacing:-.04em}
.toast{border-radius:999px}
::selection{background:var(--brass);color:var(--on-brass)}

/* fundo de grelha + brilho (hero, login, boas-vindas) */
.glow{position:relative;isolation:isolate;overflow:hidden}
.glow::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 55% at 50% 0%,color-mix(in srgb,var(--brass) 26%,transparent),transparent 70%),radial-gradient(40% 45% at 88% 30%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}
.glow::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55;background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 75% 60% at 50% 15%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse 75% 60% at 50% 15%,#000 25%,transparent 75%)}
.hello.glow::after{background-size:36px 36px}
.hello.glow::before{height:auto}
.hello.glow{background:linear-gradient(90deg,var(--accent),var(--brass)) bottom/100% 6px no-repeat,var(--hero)}

/* ---- Website ---- */
.s-nav{display:block;position:sticky;top:0;z-index:30;padding-block:0;background:color-mix(in srgb,var(--hero) 80%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--hero-line);color:var(--hero-ink)}
.s-nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;flex-wrap:wrap;padding-block:8px}

.s-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--surface);margin-top:56px}

.s-sec{padding-block:96px}

.s-h>.eyebrow,.s-h>h2{grid-column:1}

.about .s-h{grid-template-columns:1fr;margin:0}

.a-list div{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

.req .s-h{grid-template-columns:1fr;margin-bottom:0}

.direct a,.direct div{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:15px 18px;color:var(--ink);text-decoration:none;background:var(--surface);transition:border-color .2s,transform .2s}

.s-foot{padding-block:40px}
.s-foot .wrap{align-items:center}
.rv{transform:translateY(18px);opacity:.001;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .9s}
.rv.in{transform:none;opacity:1}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}
@media (prefers-reduced-motion:reduce){.rv{transform:none;opacity:1;transition:none}.marq .track{animation:none}.svc div,.b-brass,.b-line,.direct a{transition:none}}

.s-top.glow::before{background:radial-gradient(50% 45% at 20% 25%,color-mix(in srgb,var(--brass) 22%,transparent),transparent 70%),radial-gradient(45% 45% at 82% 20%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),radial-gradient(40% 35% at 50% 75%,color-mix(in srgb,var(--m-espaco) 10%,transparent),transparent 70%)}
.hero2{display:block;text-align:center;padding-block:36px 40px}
.hero2 h1{max-width:15ch;margin-inline:auto;font-size:clamp(2.7rem,7vw,5.6rem)}
.hero2 p.lead{margin-inline:auto;max-width:56ch}
.hero2 .cta{justify-content:center}
.b-line{border-color:var(--line)}
.stage{position:relative;max-width:440px;margin:64px auto 0;text-align:left}
.stage .invite{max-width:none;justify-self:auto;margin:0 auto;background:color-mix(in srgb,var(--surface) 55%,transparent);border-color:var(--line);box-shadow:0 50px 100px -40px rgba(0,0,0,.35),0 30px 80px -50px var(--accent)}
.fl{position:absolute;display:flex;align-items:center;gap:12px;text-align:left;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:12px 16px 12px 12px;box-shadow:0 24px 50px -28px rgba(0,0,0,.4);white-space:nowrap}
.fl b{display:block;font-weight:600;font-size:.9rem}
.fl small{display:block;color:var(--muted);font-size:.78rem}
.fi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.fi .ni{width:18px;height:18px}
.fl-l{left:-210px;top:18%}
.fl-r{right:-200px;top:44%}
.fl-b{left:-150px;bottom:6%}
@media (prefers-reduced-motion:no-preference){.stage.in .fl{animation:floaty 6s ease-in-out infinite}.stage.in .fl-r{animation-delay:1.5s}.stage.in .fl-b{animation-delay:3s}.stage.in .invite{animation:none}}
@media (max-width:980px){.fl-l{left:-60px}.fl-r{right:-60px}.fl-b{left:-40px}}
@media (max-width:700px){.fl{display:none}.stage{margin-top:44px}}
.marq{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);margin-top:40px}
.s-stats{margin-top:48px}
/* ======================= v2 · logótipos, formulários e IA ======================= */
.logo-img{display:block;width:100%;height:100%;object-fit:contain;border-radius:12px;background:#fff}
.logo-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.logo-opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;justify-items:center;text-align:center;padding:18px 14px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.logo-opt:hover{border-color:var(--muted)}
.logo-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.logo-opt:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.logo-opt .lo-prev{width:64px;height:64px;display:grid;place-items:center;font-size:1.6rem;color:var(--muted)}
.logo-opt .lo-prev svg{width:64px;height:64px}
.logo-opt.up{border-style:dashed}
.logo-opt.up .lo-prev{border:1.5px dashed var(--line);border-radius:16px}
.logo-opt b{font-weight:600}
.logo-opt small{color:var(--muted);font-size:.78rem;line-height:1.35}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets .btn{font-weight:500}
.draft-note{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--good-soft);color:var(--good);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:12px;font-size:.88rem;font-weight:500}
#evForm>.row:last-child,#cliForm>.row:last-child,#fornForm>.row:last-child{position:sticky;bottom:12px;z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px;margin-inline:-6px;box-shadow:0 14px 30px -20px rgba(0,0,0,.4)}
#evForm>.row:last-child::before,#cliForm>.row:last-child::before,#fornForm>.row:last-child::before{content:"Ctrl + Enter para guardar";margin-right:auto;padding-left:12px;font-size:.78rem;color:var(--muted)}
@media (max-width:600px){#evForm>.row:last-child::before,#cliForm>.row:last-child::before,#fornForm>.row:last-child::before{display:none}}
.ai-only{display:none!important}
html.ai-on .ai-only{display:revert!important}
html.ai-on .btn.ai-only{display:inline-flex!important}
.aibox{margin-bottom:14px;border-radius:20px;padding:14px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),color-mix(in srgb,var(--brass) 9%,var(--surface)));border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.aibox summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
.aibox summary::-webkit-details-marker{display:none}
.aibox[open] summary{margin-bottom:8px}
.aibox textarea{margin:10px 0;min-height:96px;background:var(--surface)}
.ai-spark{color:var(--accent);font-size:1.1em}
.ai-filled{background:color-mix(in srgb,var(--brass) 14%,var(--surface))!important;border-color:var(--brass)!important}
label.ai-filled{border-radius:8px}
.ai-tb{background:linear-gradient(135deg,var(--accent),var(--brass))!important;color:#fff!important;border:0!important}
.ai-tb span{font-size:1.05em}
/* contraste: avatar, contadores e setas */
.me .av{background:var(--accent);color:var(--accent-ink)}
.app.v2 .nav .count.hot,.app.v2 .nav button[aria-current="page"] .count.hot{background:var(--accent);color:var(--accent-ink)}
.app.v2 .stats .stat:first-child .go{color:var(--accent-ink)!important;opacity:1}
.ai-tb{background:var(--accent)!important;color:var(--accent-ink)!important}
.lg-mid h1 .it{color:var(--hero-em)}
.stat .go{color:var(--muted)!important;opacity:.9!important}
.lnb{background:color-mix(in srgb,var(--c),#000 22%);color:#fff}
html.dark .lnb{background:var(--c);color:#14110f}
html:not(.dark) .s-confirmado,html:not(.dark) .pipe button.done{color:color-mix(in srgb,var(--accent),#000 18%)}
.invite .k,.invite .sig{color:#7d5f26}
.fi{color:color-mix(in srgb,var(--c),#000 25%)}
.doc-link{display:grid;grid-template-columns:2fr 1.2fr auto;gap:8px;margin-bottom:12px}
@media (max-width:700px){.doc-link{grid-template-columns:1fr}}
.file .act select{width:auto}
.up-field{cursor:pointer;margin-bottom:8px}
.up-field b{color:var(--accent)}
.ai-img-only{display:none!important}
html.ai-img .ai-img-only{display:inline-flex!important}
.fcats{display:inline-flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.fcat{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.nb-new{font:700 .56rem/1 var(--f-mono);letter-spacing:.08em;padding:3px 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);flex:none}
.app.v2 .nav button[aria-current="page"] .nb-new{background:var(--on-brass);color:var(--brass)}
@media (max-width:820px){.app.v2 .nav .nb-new{position:absolute;top:2px;left:calc(50% + 4px);font-size:.5rem;padding:2px 4px}}
/* ======================= Tarefas ======================= */
.tk-quick{display:flex;gap:8px;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:18px;padding:8px;box-shadow:0 10px 30px -24px rgba(0,0,0,.3)}
.tk-quick input{flex:1;border:0;background:transparent;font-size:1rem;padding:8px 10px}
.tk-quick input:focus{outline:none}
.tk-quick:focus-within{border-color:var(--accent)}
.tk-quick .btn .ni{width:15px;height:15px}
.chip-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.9rem}
.chip-btn .mono{font-size:.72rem;color:var(--muted)}
.chip-btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip-btn.on .mono{color:inherit;opacity:.75}
.chip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tk-grp{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.tk-list{display:grid;gap:8px}
.tk-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:16px;padding:10px 14px;border-left:4px solid transparent}
.tk-card.pri-alta{border-left-color:var(--bad)}
.tk-card.late{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.tk-card.done{opacity:.6}
.tk-card.done .tk-main b{text-decoration:line-through}
.tk-chk{position:relative;flex:none;width:24px;height:24px;cursor:pointer}
.tk-chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.tk-chk span{position:absolute;inset:0;border:2px solid var(--line);border-radius:50%;transition:.15s}
.tk-chk input:checked+span{background:var(--good);border-color:var(--good)}
.tk-chk input:checked+span::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tk-chk input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tk-chk:hover span{border-color:var(--good)}
.tk-main{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;gap:5px}
.tk-main b{font-weight:600;overflow-wrap:anywhere}
.tk-main:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.tk-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted)}
.tk-due{font-family:var(--f-mono);font-size:.76rem}
.tk-due.neg{color:var(--bad);font-weight:600}
.tk-ev{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-ev::before{content:"◆ ";color:var(--brass)}
.tk-p{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.74rem}
.tk-p i{width:46px;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--good) var(--p),var(--sunk) var(--p))}
.tk-av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.tk-av.none{background:var(--sunk);color:var(--muted)}
.tk-av.sm{width:24px;height:24px;font-size:.62rem}
.tk-head{align-items:flex-start}
.tk-title{width:100%;font:500 clamp(1.5rem,3vw,2.1rem)/1.15 var(--f-display);letter-spacing:-.035em;border:1px solid transparent;background:transparent;padding:4px 8px;margin-left:-8px;border-radius:10px;color:var(--ink)}
.tk-title:hover{border-color:var(--line)}
.tk-title:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.tk-est{margin-bottom:16px}
.tk-cols{align-items:start}
.tk-bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-bottom:12px}
.tk-bar i{display:block;height:100%;background:var(--good);border-radius:9px;transition:width .3s}
.ck-list{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px}
.ck-list li{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:10px}
.ck-list li:hover{background:var(--sunk)}
.ck-list input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--good)}
.ck-txt{flex:1;border:1px solid transparent!important;background:transparent!important;padding:6px 8px!important}
.ck-txt:focus{border-color:var(--accent)!important;background:var(--surface)!important}
.ck-list li.done .ck-txt{text-decoration:line-through;color:var(--muted)}
.ck-by{flex:none;font-size:.6rem;font-weight:600;color:var(--good);border:1px solid var(--good);border-radius:999px;padding:1px 6px}
.ck-add{display:flex;gap:8px}
.ck-add input{flex:1}
.note-form{display:grid;gap:10px;margin-bottom:16px}
.note-form textarea{min-height:90px}
.notes{display:grid;gap:10px}
.note{border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:14px;padding:12px 14px;background:var(--surface)}
.note.priv{background:color-mix(in srgb,var(--brass) 9%,var(--surface));border-color:color-mix(in srgb,var(--brass) 40%,var(--line))}
.note header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.note header b{font-weight:600;font-size:.9rem}
.note p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tk-est button{padding:8px 16px;font-size:.9rem}
.tk-est button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.note-lock{background:color-mix(in srgb,var(--brass) 18%,var(--surface));color:var(--ink);font-size:.72rem}
@media (max-width:700px){.tk-card{padding:10px 12px;gap:10px}.tk-quick{flex-wrap:nowrap}.tk-quick .btn{padding-inline:12px}.tk-ev{max-width:160px}}
/* ======================= Website · modelo Moderno ======================= */
.hm-hero{--hero-ink:var(--ink);--hero-muted:var(--muted);--hero-line:color-mix(in srgb,var(--line) 70%,transparent);--hero-em:var(--accent);background:var(--bg);color:var(--ink);padding-top:96px}
.hm-hero.glow::before{background:radial-gradient(45% 55% at 78% 40%,color-mix(in srgb,var(--brass) 26%,transparent),transparent 70%),radial-gradient(40% 50% at 92% 75%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%),radial-gradient(35% 40% at 10% 10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%)}
.hm-hero-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center;padding-block:48px 72px}
.hm-copy h1{font-weight:500;font-size:clamp(2.6rem,5.4vw,4.6rem);line-height:1;letter-spacing:-.045em;margin:22px 0 20px;color:var(--ink)}
.hm-copy h1 em{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent)}
.hm-copy .lead{font-size:1.1rem;line-height:1.6;color:var(--muted);max-width:50ch}
.hm-copy .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hm-trust{list-style:none;padding:0;margin:34px 0 0;display:flex;gap:28px;flex-wrap:wrap}
.hm-trust li{display:grid;gap:2px;padding-left:14px;border-left:2px solid var(--brass)}
.hm-trust b{font-weight:600;font-size:1.15rem;letter-spacing:-.02em}
.hm-trust span{color:var(--muted);font-size:.86rem}
.hm .stage{margin:0 auto;max-width:400px;width:100%}
.hm .fl-l{left:auto;right:-140px;top:44%}.hm .fl-r{right:-90px;top:-7%}.hm .fl-b{left:-70px;bottom:-7%}
@media (max-width:1240px){.hm .fl-l{right:-50px}.hm .fl-r{right:-30px}.hm .fl-b{left:-30px}}
.hm .marq{margin-top:0}
.hm-metro{max-width:290px}
.hm-metro span:last-child{display:grid;line-height:1.2}
.hm-metro small{font-weight:400;font-size:.76rem;color:#666B68}
.hm-metro div{min-height:44px}
.hm-bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hm-feat{grid-column:span 3;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center;padding:14px 32px 14px 14px;border-radius:26px;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 20px 50px -40px rgba(0,0,0,.35)}
.hm-feat svg{display:block;width:100%;height:auto;border-radius:18px}
.hm-feat h3{font-weight:500;font-size:clamp(1.5rem,2.6vw,2.1rem);letter-spacing:-.035em;line-height:1.1;margin:12px 0 10px}
.hm-feat p{color:var(--muted);line-height:1.6}
.hm-feat .eyebrow,.hm-split .eyebrow,.hm .s-h .eyebrow{font-family:var(--f-mono);font-weight:500;font-size:.74rem;letter-spacing:.1em;color:var(--muted)}
.hm-card{padding:24px;border-radius:22px;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);display:grid;gap:8px;align-content:start;transition:transform .25s,box-shadow .25s,border-color .25s}
.hm-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:0 22px 40px -28px var(--c)}
.hm-card .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:color-mix(in srgb,var(--c),#000 20%);background:color-mix(in srgb,var(--c) 12%,var(--surface));margin-bottom:10px}
.hm-card .ico svg{width:21px;height:21px}
.hm-card h3{font-weight:500;font-size:1.25rem;letter-spacing:-.025em}
.hm-card p{color:var(--muted);line-height:1.55;font-size:.95rem}
.hm-band{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent-soft) 70%,transparent) 30%,color-mix(in srgb,var(--accent-soft) 70%,transparent) 70%,transparent)}
.hm-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.hm-split h2{font-weight:500;font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.02;letter-spacing:-.04em;margin:14px 0 16px}
.hm-split h2 .it{color:var(--accent)}
.hm-split p{color:var(--muted);font-size:1.05rem;line-height:1.6;max-width:46ch}
.hm-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.hm-tabs button{all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.92rem}
.hm-tabs button:hover{border-color:var(--muted)}
.hm-tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.hm-tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hm-tl{display:grid;justify-items:center}
.hm-tl .invite{max-width:420px;width:100%;transform:none;border-radius:22px;padding:12px;background:color-mix(in srgb,var(--surface) 60%,transparent);border:1px solid var(--line);box-shadow:0 50px 100px -45px rgba(0,0,0,.4),0 30px 80px -50px var(--accent)}
.hm-tl .invite-in{border-radius:14px;outline:none;border:1px solid #E5DCC8}
.hm-about{display:grid;gap:26px;max-width:900px}
.hm-about blockquote{margin:0;font-weight:400;font-size:clamp(1.6rem,3.4vw,2.6rem);line-height:1.15;letter-spacing:-.035em}
.hm-about blockquote::before{content:"“";display:block;font-family:var(--f-serif);font-size:4.2rem;line-height:.6;color:var(--brass);margin-bottom:12px}
.hm-faq-wrap{align-items:start}
.hm-faq{display:grid;gap:10px}
.hm-faq details{border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;background:var(--surface);padding:4px 20px}
.hm-faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;font-weight:600}
.hm-faq summary::-webkit-details-marker{display:none}
.hm-faq summary::after{content:"+";font-size:1.4rem;font-weight:300;color:var(--accent);transition:transform .25s}
.hm-faq details[open] summary::after{transform:rotate(45deg)}
.hm-faq summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.hm-faq p{color:var(--muted);line-height:1.6;padding-bottom:16px}
.hm .req-form{border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line))}
.hm-top{padding-top:140px}
.hm-foot{background:var(--hero);color:var(--hero-muted);padding-block:56px 34px;margin-top:40px}
.hm-foot .s-logo{color:var(--hero-ink)}
.hm-foot-top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--hero-line)}
.hm-foot-top p{flex:1;min-width:200px}
.hm-foot-bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:22px;font-size:.88rem}
.hm-foot .pwr{color:var(--hero-muted)}

function syncChat(){
  const want = wantedChan();
  if (want === chatChan) return;
  if (chatUnsub){ try { chatUnsub(); } catch(e){} chatUnsub = null; }
  chatChan = want; S.msgs = [];
  if (!want) return;
  if (S.mode === "db" && db){
    chatUnsub = db.collection("mensagens").where("canal", "==", want).orderBy("ts", "desc").limit(200).onSnapshot(snap => {
      S.msgs = snap.docs.map(d => ({id:d.id, ...d.data()})).reverse(); paintChat();
    }, err => toast("Chat indisponível (" + err.code + ")."));

/* ================= Tema (paletas) ================= */
function mix(a, b, t){ const p = x => [1,3,5].map(i => parseInt(String(x).slice(i, i + 2), 16) || 0); const A = p(a), B = p(b); return "#" + A.map((v,i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); }
const lumHex = x => { const v = [1,3,5].map(i => parseInt(String(x).slice(i, i + 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4)); return .2126 * v[0] + .7152 * v[1] + .0722 * v[2]; };
const contraste = (x, y) => { const A = lumHex(x), B = lumHex(y); return (Math.max(A, B) + .05) / (Math.min(A, B) + .05); };
// Escurece ou clareia a cor (em passos pequenos) até ter contraste suficiente com o fundo
function legivel(cor, fundo, alvo){ let c = cor; const alvoCor = lumHex(fundo) > .4 ? "#000000" : "#FFFFFF"; for (let i = 0; i < 20 && contraste(c, fundo) < alvo; i++) c = mix(c, alvoCor, .08); return c; }
const melhorTexto = (fundo, opcoes) => opcoes.reduce((m, o) => contraste(o, fundo) > contraste(m, fundo) ? o : m, opcoes[0]);
function palette(c){
  if (c?.tema === "custom"){ const x = {a:"#8A2D4B", b:"#9A7430", h:"#1E2A26", ...(c.temaCustom || {})};

// Entrada suave ao fazer scroll (como no site FERRO); o que já apareceu não volta a animar
const seenRv = new Set(); let rvIO = null;
function reveal(){
  const els = [...document.querySelectorAll(".rv")], key = el => (el.closest("section,[id]")?.id || "top") + ":" + [...(el.closest("section,[id]") || document.body).querySelectorAll(".rv")].indexOf(el);
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches){ els.forEach(el => el.classList.add("in")); return; }
  rvIO?.disconnect();
  rvIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); seenRv.add(e.target.dataset.rk); rvIO.unobserve(e.target); } }), {threshold:.12, rootMargin:"0px 0px -4% 0px"});
  els.forEach(el => { el.dataset.rk = key(el); if (seenRv.has(el.dataset.rk)) el.classList.add("in"); else rvIO.observe(el); });
  setTimeout(() => els.forEach(el => { if (el.getBoundingClientRect().top < innerHeight) el.classList.add("in"); }), 1200);
}

    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"eventos", f:"30d"}))}" class="stat"><span class="label">Próximos 30 dias</span><b>${em30}</b><span class="muted">eventos</span><span class="go" aria-hidden="true">→</span></button>
    ${M() ? `<button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-rec"}))}" class="stat"><span class="label">A receber</span><b>${money(s("falta"))}</b><span class="muted">de clientes</span><span class="go" aria-hidden="true">→</span></button>
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-pag"}))}" class="stat"><span class="label">A pagar</span><b>${money(s("aPagar"))}</b><span class="muted">a fornecedores</span><span class="go" aria-hidden="true">→</span></button>
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-res"}))}" class="stat"><span class="label">Margem confirmada</span><b>${money(s("margem"))}</b><span class="muted">${pct(s("sub") ? s("margem") / s("sub") : 0)} da venda s/ IVA</span><span class="go" aria-hidden="true">→</span></button>` : ""}

    <section class="panel"><div class="panel-h"><h2>Precisa de atenção</h2><span class="mono muted">${att.length}</span></div>
      ${att.length ? `<div class="attn">${att.slice(0,14).map(a => `<div><span class="dot2 ${a.c}"></span><span>${a.t} <button class="btn ghost sm" data-act="goJ" data-j="${h(JSON.stringify(a.go))}">Abrir</button></span></div>`).join("")}</div>` : `<div class="attn"><div><span class="dot2 g"></span><span>Tudo em dia.</span></div></div>`}

function evTable(L, noClient){

  ${L.map(e => { const d = daysTo(e.data), p = prod(e), t = totals(e); return `<tr class="click" data-act="open" data-id="${e.id}" tabindex="0"><td class="ref">${h(e.ref)}</td><td class="mono">${dt(e.data)}${d !== null && d >= 0 && d <= 14 ? ` <span class="muted">· ${d === 0 ? "hoje" : d + " d"}</span>` : ""}</td><td><b>${h(e.nome)}</b><div class="muted small">${h(e.tipo)}</div></td>${noClient ? "" : `<td>${h(cli(e).nome)}</td>`}<td class="num">${pax(e)}</td><td class="small">${p.mods ? `OS ${p.osOk}/${p.mods}` : "—"}${p.late ? ` · <span class="neg">${p.late} atrasada${p.late > 1 ? "s" : ""}</span>` : ""}</td><td>${chip(e.estado)}</td>${M() ? `<td class="num">${money(t.total)}</td><td class="num ${t.margem < 0 ? "neg" : ""}">${money(t.margem)}</td>` : ""}</tr>`; }).join("")}

  <div class="row" style="margin-bottom:14px">${fb("abertos","Por tratar")}${PEDEST.map(([k,n]) => fb(k, n)).join("")}${fb("todos","Todos")}</div>

    <div class="row">${p.estado === "convertido" && S.eventos[p.eventoId] ? `<button class="btn pri sm" data-act="open" data-id="${p.eventoId}">Abrir evento ${h(S.eventos[p.eventoId].ref)}</button>` : `<button class="btn pri sm" data-act="convertPed" data-id="${p.id}">Converter em evento</button><button class="btn sm ai-only" data-act="aiOpen" data-q="${h(`Escreve uma resposta por email ao pedido ${p.ref} de ${p.nome}: agradece, confirma o que entendemos do pedido, faz as 3 perguntas que faltam para fazer a proposta e diz que a proposta segue no prazo de uma semana.`)}">✦ Resposta com IA</button>${p.estado === "novo" ? `<button class="btn sm" data-act="pedEstado" data-id="${p.id}" data-v="analise">Marcar em análise</button>` : ""}${p.estado !== "recusado" ? `<button class="btn sm" data-act="pedEstado" data-id="${p.id}" data-v="recusado">Recusar</button>` : ""}`}
      <span><button class="btn sm ghost danger" data-act="askDel" data-what="pedidos" data-id="${p.id}">Apagar</button></span></div>

/* ================= Eventos ================= */
function eventos(){
  const f = R.f || "ativos";
  let L = evList();
  if (f === "ativos") L = L.filter(e => !["fechado","cancelado"].includes(e.estado)); else if (f === "30d") L = L.filter(e => { const d = daysTo(e.data); return !["fechado","cancelado"].includes(e.estado) && d !== null && d >= 0 && d <= 30; }); else if (f !== "todos") L = L.filter(e => e.estado === f);
  const fb = (k, n) => `<button class="btn sm ${f === k ? "pri" : ""}" data-act="filter" data-f="${k}">${n}</button>`;
  return `<div class="head"><div><div class="crumbs">Pedido › Cliente › <b>Evento</b> › Proposta › Ordens de serviço › Timeline › Contas</div><h1>Eventos</h1></div><button class="btn pri" data-act="newEvento">Novo evento</button></div>
  ${Object.keys(S.eventos).length ? `<div class="row" style="margin-bottom:14px">${fb("ativos","Ativos")}${fb("30d","Próximos 30 dias")}${ESTADOS.map(e => fb(e.k, e.n)).join("")}${fb("cancelado","Cancelados")}${fb("todos","Todos")}</div><section class="panel">${evTable(L)}</section>` : emptyData()}`;
}
function evento(ev){
  const c = cli(ev), t = totals(ev), tab = R.tab || "resumo", p = prod(ev);

  const cur = tabs.some(x => x[0] === tab) ? tab : "resumo";
  const body = {resumo:evResumo, proposta:evProposta, timeline:evTimeline, rooming:evRooming, os:evOS, checklist:evChecklist, contas:evContas, chat:evChat}[cur];
  const d = daysTo(ev.data);

      <div class="crumbs"><button data-act="go" data-v="clientes">Clientes</button>›<button data-act="openCli" data-id="${ev.clienteId}">${h(c.nome)}</button>›<span class="mono">${h(ev.ref)}</span></div>
      <h1>${h(ev.nome)}</h1>
      <div class="muted">${h(ev.tipo)} · ${dt(ev.data)}${d !== null && d >= 0 ? ` (${d === 0 ? "hoje" : "daqui a " + d + " dias"})` : ""} · ${h(ev.horaInicio||"")}${ev.horaFim ? "–" + h(ev.horaFim) : ""} · ${paxTxt(ev)}</div>

  </div>

  ${body(ev, t)}`;
}

/* ---------- Timeline: linha de metro vertical ---------- */
function evTimeline(ev){
  const T = timeline(ev), isToday = daysTo(ev.data) === 0, done = T.filter(t => t.feito).length;
  const next = T.find(t => !t.feito);
  const modOpts = [["","Organização"],["cliente","Cliente"], ...activeMods(ev).map(m => [m.k, m.n])];
  let lastFase = null, html = "";
  T.forEach((t, i) => {
    const pc = `var(--ph-${FASES.includes(t.fase) ? t.fase.toLowerCase() : "evento"})`;
    if (t.fase !== lastFase){ html += `<div class="zone ${lastFase === null ? "first" : ""}" style="--pc:${pc}"><span class="rail"></span><span class="zl">${h(t.fase || "Sem fase")} · ${T.filter(x => x.fase === t.fase).length}</span></div>`; lastFase = t.fase; }
    const d = num(t.dur), last = i === T.length - 1, isNext = next && next.id === t.id && (isToday || done > 0);
    html += `<div class="stn ${t.feito ? "done" : ""} ${isNext ? "next" : ""} ${last ? "last" : ""}" id="row-${t.id}" style="--c:${laneVar(t.mod)};--pc:${pc}">
      <div class="tm">${t.m !== null ? fmtMin(t.m) : "—"}${d && t.m !== null ? `<small>até ${fmtMin(t.m + d)}</small>` : ""}</div>
      <div class="rl"><span class="dot"></span></div>
      <div class="bd"><div class="ttl">${h(t.acao || "Paragem sem nome")}</div><div class="meta">${lnb(t.mod)}<span>${h(LANES[t.mod || ""] || "")}</span>${t.resp ? `<span>· ${h(t.resp)}</span>` : ""}${t.local ? `<span>· ${h(t.local)}</span>` : ""}${d ? `<span>· ${durTxt(d)}</span>` : ""}</div></div>
      <div class="act"><input type="checkbox" data-ev="${ev.id}" data-list="timeline" data-row="${t.id}" data-f="feito" ${t.feito ? "checked" : ""} aria-label="Concluído: ${h(t.acao)}" title="Marcar como concluído"><button class="btn sm ${R.edit === t.id ? "pri" : ""}" data-act="editStn" data-row="${t.id}">${R.edit === t.id ? "Fechar" : "Editar"}</button></div>
      ${R.edit === t.id ? `<div class="stn-edit"><div class="grid">
        <label class="field"><span>Hora</span>${cell(ev, "timeline", t, "hora", 'type="time"')}</label>
        <label class="field"><span>Duração (min)</span><input type="number" min="0" step="5" data-ev="${ev.id}" data-list="timeline" data-row="${t.id}" data-f="dur" value="${h(t.dur)}"></label>
        <label class="field"><span>Fase</span>${sel(ev, "timeline", t, "fase", FASES.map(f => [f,f]), "Fase")}</label>
        <label class="field"><span>Serviço</span>${sel(ev, "timeline", t, "mod", modOpts, "Serviço")}</label>
        <label class="field wide"><span>Momento</span>${cell(ev, "timeline", t, "acao", 'placeholder="O que acontece"')}</label>
        <label class="field"><span>Responsável</span>${cell(ev, "timeline", t, "resp")}</label>
        <label class="field"><span>Local</span>${cell(ev, "timeline", t, "local")}</label></div>
        <div class="spread"><span><button class="btn sm ghost danger" data-act="delRow" data-list="timeline" data-row="${t.id}">Remover paragem</button></span><button class="btn sm pri" data-act="editStn" data-row="${t.id}">Concluir</button></div></div>` : ""}
    </div>`;
  });
  const used = [...new Set(T.map(t => t.mod || ""))];
  const timed = T.filter(x => x.m !== null);
  return `${xbar("Timeline do dia", "A linha do dia por fases, com responsáveis e caixas para marcar no local.", [{k:"timeline", n:"Exportar timeline", ok:T.length > 0, falta:"Adiciona paragens"}])}
  <section class="panel">
    <div class="panel-h"><div><h2>Linha do dia${isToday ? " · hoje" : ""}</h2>${T.length ? `<span class="small muted">${T.length} paragens · ${done} concluídas${timed.length ? ` · ${fmtMin(timed[0].m)} → ${fmtMin(Math.max(...timed.map(x => x.m + num(x.dur))))}` : ""}</span>` : ""}</div>
      <div class="row"><button class="btn sm" data-act="genTimeline">Gerar a partir dos serviços</button><button class="btn sm pri" data-act="addRow" data-list="timeline">Adicionar paragem</button></div></div>
    ${T.length ? `<div class="row small muted" style="margin-bottom:10px;gap:14px">${used.map(k => `<span style="display:inline-flex;gap:6px;align-items:center">${lnb(k)}${h(LANES[k] || k)}</span>`).join("")}</div><div class="metro">${html}</div>`
      : `<div class="empty">Ainda não há paragens. Gera a linha a partir dos horários dos serviços (montagem, catering, DJ…) e ajusta depois.</div>`}
  </section>`;
}

function fieldHTML(path, f, val, evId){
  const [k, n, type, opts] = f;
  const bind = evId ? `data-ev="${evId}" data-path="${path}"` : `name="${path}"`;
  const cls = type === "textarea" ? "field wide" : "field";
  if (type === "textarea") return `<label class="${cls}"><span>${n}</span><textarea ${bind}>${h(val)}</textarea></label>`;
  if (type === "select") return `<label class="${cls}"><span>${n}</span><select ${bind}><option value="">—</option>${opts.map(o => `<option ${val === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
  return `<label class="${cls}"><span>${n}</span><input ${type ? `type="${type}"` : ""} ${bind} value="${h(val)}"></label>`;
}

function paintChat(){
  const el = $("#chatLog"); if (!el) return;

  let lastDay = "";

    return sep + `<div class="msg ${me ? "me" : ""}"><span class="who">${me ? "Tu" : h(m.autor)} · ${d.toLocaleTimeString("pt-PT", {hour:"2-digit", minute:"2-digit"})}</span><div class="bub">${h(m.txt)}</div></div>`; }).join("");

function fornecedor(f){

/* ================= Contas (global) ================= */
function contas(){
  const E = evList().filter(e => e.estado !== "cancelado");
  const conf = E.filter(live), T = conf.map(totals), s = k => T.reduce((a,t) => a + t[k], 0);
  const rec = conf.map(e => ({...receivable(e), ev:e})).filter(r => r.falta > .005);
  const pay = conf.flatMap(payables).filter(x => x.falta > .005).sort((a,b) => (a.venc||"").localeCompare(b.venc||""));
  const pipe = E.filter(e => ["pedido","proposta"].includes(e.estado)).map(totals);
  return `<div class="head"><div><h1>Contas</h1><div class="muted">Eventos confirmados, realizados e fechados. Calculado a partir das propostas, das ordens de serviço e dos pagamentos registados.</div></div></div>
  <div class="stats">
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-res"}))}" class="stat"><span class="label">Faturação confirmada</span><b>${money(s("total"))}</b><span class="muted">com IVA</span><span class="go" aria-hidden="true">→</span></button>
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-rec"}))}" class="stat ${s("falta") > .005 ? "hl" : ""}"><span class="label">A receber</span><b>${money(s("falta"))}</b><span class="muted">${rec.filter(r => r.late).length} em atraso</span><span class="go" aria-hidden="true">→</span></button>
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-pag"}))}" class="stat"><span class="label">A pagar</span><b>${money(s("aPagar"))}</b><span class="muted">${pay.filter(x => x.venc && x.venc < today()).length} vencidos</span><span class="go" aria-hidden="true">→</span></button>
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-res"}))}" class="stat"><span class="label">Caixa do negócio</span><b class="${s("pago") - s("pagoF") < 0 ? "neg" : ""}">${money(s("pago") - s("pagoF"))}</b><span class="muted">recebido − pago</span><span class="go" aria-hidden="true">→</span></button>
    <button type="button" data-act="goJ" data-j="${h(JSON.stringify({v:"contas", foco:"sec-res"}))}" class="stat"><span class="label">Margem</span><b>${money(s("margem"))}</b><span class="muted">${pct(s("sub") ? s("margem") / s("sub") : 0)} · em proposta: ${money(pipe.reduce((a,t) => a + t.margem, 0))}</span><span class="go" aria-hidden="true">→</span></button>
  </div>
  <div class="cols2">
    <section class="panel" id="sec-rec"><h2 style="margin-bottom:10px">A receber de clientes</h2>${rec.length ? `<div class="tw"><table><thead><tr><th>Cliente / evento</th><th>Próximo</th><th class="num">Em dívida</th></tr></thead><tbody>${rec.map(r => `<tr class="click ${r.late ? "late" : ""}" data-act="open" data-id="${r.ev.id}" data-tab="contas" tabindex="0"><td><b>${h(cli(r.ev).nome)}</b><div class="small muted">${h(r.ev.nome)} · ${dt(r.ev.data)}</div></td><td class="small">${r.next ? `${h(r.next.n)} até <span class="mono">${dt(r.next.d)}</span>${r.late ? ` <span class="chip s-bad">atraso</span>` : ""}` : ""}</td><td class="num mono">${money(r.falta)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Nada por receber.</p>`}</section>
    <section class="panel" id="sec-pag"><h2 style="margin-bottom:10px">A pagar a fornecedores</h2>${pay.length ? `<div class="tw"><table><thead><tr><th>Fornecedor / evento</th><th>Vence</th><th class="num">Falta</th></tr></thead><tbody>${pay.map(x => `<tr class="click ${x.venc && x.venc < today() ? "late" : ""}" data-act="open" data-id="${x.ev.id}" data-tab="contas" tabindex="0"><td><span style="display:inline-flex;gap:6px;align-items:center">${lnb(x.k)}<b>${h(x.nome)}</b></span><div class="small muted">${h(x.ev.nome)}</div></td><td class="mono small">${dt(x.venc)}</td><td class="num mono">${money(x.falta)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Nada por pagar.</p>`}</section>
  </div>
  <section class="panel" style="margin-top:16px" id="sec-res"><h2 style="margin-bottom:10px">Resultado por evento</h2><div class="tw"><table><thead><tr><th>Evento</th><th>Data</th><th class="num">Venda s/ IVA</th><th class="num">Custos</th><th class="num">Margem</th><th class="num">%</th><th class="num">Recebido</th><th class="num">Pago</th></tr></thead><tbody>
    ${conf.map(e => { const t = totals(e); return `<tr class="click" data-act="open" data-id="${e.id}" data-tab="contas" tabindex="0"><td><b>${h(e.nome)}</b><div class="small muted">${h(cli(e).nome)}</div></td><td class="mono">${dt(e.data)}</td><td class="num mono">${money(t.sub)}</td><td class="num mono">${money(t.custo)}</td><td class="num mono ${t.margem < 0 ? "neg" : "pos"}">${money(t.margem)}</td><td class="num">${pct(t.mpct)}</td><td class="num mono">${money(t.pago)}</td><td class="num mono">${money(t.pagoF)}</td></tr>`; }).join("") || `<tr><td colspan="8" class="muted">Sem eventos confirmados.</td></tr>`}
    </tbody>${conf.length ? `<tfoot><tr><td colspan="2">Total</td><td class="num mono">${money(s("sub"))}</td><td class="num mono">${money(s("custo"))}</td><td class="num mono">${money(s("margem"))}</td><td class="num">${pct(s("sub") ? s("margem") / s("sub") : 0)}</td><td class="num mono">${money(s("pago"))}</td><td class="num mono">${money(s("pagoF"))}</td></tr></tfoot>` : ""}</table></div></section>`;
}

.d{--ink:#1D1F1E;--mut:#666B68;--ln:#DCDFDB;--ac:var(--doc-ac,#8A2D4B);--soft:var(--doc-soft,#F6EEF1);font-family:"IBM Plex Sans",Arial,sans-serif;color:var(--ink);font-size:12px;line-height:1.5;padding:40px 46px 28px;background:#fff}

.d h1,.d h2{font-family:"Bricolage Grotesque",Arial,sans-serif;margin:0;letter-spacing:-.01em}
.d-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.d-co{display:flex;gap:12px;align-items:flex-start;max-width:55%}
.d-mark{width:42px;height:42px;flex:none}.d-mark svg{width:100%;height:100%;display:block}

.d-id{text-align:right}

.d-id h1{font-size:24px;line-height:1.15;margin:2px 0 6px}
.d-ref{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;border:1px solid var(--ln);border-radius:3px;padding:1px 7px}

.d-facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln);border-top:none;margin-bottom:22px}

.d-facts span{display:block;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
