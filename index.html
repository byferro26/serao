.d-parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}

.d-lab{display:block;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:3px}

.d-sec{margin-bottom:18px}
.d-sec>h2{font-size:12px;font-family:"IBM Plex Sans",Arial,sans-serif;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);padding-bottom:5px;border-bottom:1px solid var(--ink);margin-bottom:6px;display:flex;justify-content:space-between;gap:12px}

.d .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.d .mono{font-family:"IBM Plex Mono",monospace;font-size:11px}

.d-stn.last .r::before{bottom:auto;height:16px}
.d-stn .r b{position:relative;margin-top:7px;width:15px;height:15px;border-radius:50%;background:#fff;border:4px solid var(--c);box-sizing:border-box}
.d-stn .b{padding:5px 0 8px 4px}
.d-stn .b strong{font-size:12.5px}
.d-stn .s{font-size:9.5px;color:var(--mut);padding-top:7px}

.d-sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px}

.d-foot{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:8px;border-top:1px solid var(--ln);color:var(--mut);font-size:9.5px}
.d-pb{break-before:page;page-break-before:always;margin-top:40px;padding-top:40px;border-top:2px dashed var(--ln)}
.d-chk{display:grid;grid-template-columns:90px 1fr 60px 20px;border-bottom:1px solid var(--ln);padding:6px 0;align-items:start}
@media print{.d{padding:0}.d-pb{border-top:none;margin-top:0;padding-top:0}}`;

function docShell(ev, o){
  const co = S.config;
  const facts = o.facts || [["Data", dtLong(ev.data)], ["Horário", (ev.horaInicio || "—") + (ev.horaFim ? " – " + ev.horaFim : "")], ["Convidados", paxTxt(ev)], ["Local", (ev.modulos?.espaco && ev.espaco?.fornecedor) || "A definir"]];
  return `<div class="${o.pb ? "d-pb" : ""}"><header class="d-top"><div class="d-co"><div class="d-mark">${logoSVG(palette(S.config).L.a, palette(S.config).L.b, "#FFFFFF")}</div><div><b>${h(co.nome || "[Nome da empresa]")}</b>${co.nif ? `<span>NIF ${h(co.nif)}</span>` : ""}${co.morada ? `<span>${h(co.morada)}</span>` : ""}<span>${[co.telefone, co.email].filter(Boolean).map(h).join(" · ")}</span></div></div>
    <div class="d-id"><span class="d-kind">${h(o.kind)}</span><h1>${h(o.title)}</h1><span class="d-ref">${h(o.ref)}</span></div></header>
  <div class="d-rule"></div>
  <div class="d-facts">${facts.map(([k,v]) => `<div><span>${h(k)}</span><b>${h(v)}</b></div>`).join("")}</div>
  ${o.body}
  <footer class="d-foot"><span>${h(co.nome || "")}${co.rodape ? " · " + h(co.rodape) : ""}</span><span>${h(o.ref)} · emitido a ${dt(today())}</span></footer></div>`;
}
const partyCli = (ev, note) => { const c = cli(ev), b = billing(ev); return `<div><span class="d-lab">Cliente</span><b>${h(c.nome)}</b>${c.nif && !b.outra ? `<br>NIF ${h(c.nif)}` : ""}${c.morada && !b.outra ? `<br>${h(c.morada)}` : ""}${c.contacto || c.telefone ? `<br>${h([c.contacto, c.telefone].filter(Boolean).join(" · "))}` : ""}${note && b.outra ? `<span class="d-lab" style="margin-top:8px">Faturar a</span><b>${h(b.nome)}</b>${b.nif ? ` · NIF ${h(b.nif)}` : ""}${b.morada ? `<br>${h(b.morada)}` : ""}` : ""}</div>`; };
const partyBill = ev => { const b = billing(ev); return `<div><span class="d-lab">Faturar a</span><b>${h(b.nome)}</b>${b.nif ? `<br>NIF ${h(b.nif)}` : ""}${b.morada ? `<br>${h(b.morada)}` : ""}${b.email ? `<br>${h(b.email)}` : ""}${b.po ? `<br>Ref. / encomenda: ${h(b.po)}` : ""}</div>`; };
function billing(ev){ const f = ev.fat || {}, c = cli(ev); if (f.ativo && (f.nome || "").trim()) return {outra:true, nome:f.nome, nif:f.nif || "", morada:f.morada || "", email:f.email || "", po:f.po || ""}; return {outra:false, nome:c.nome, nif:c.nif || "", morada:c.morada || "", email:c.email || "", po:f.po || ""}; }
const partyEv = (ev, withCli) => `<div><span class="d-lab">Evento</span><b>${h(ev.nome)}</b><br>${h(ev.tipo)} · <span class="mono">${h(ev.ref)}</span>${withCli && billing(ev).outra ? `<br>Cliente: ${h(cli(ev).nome)}` : ""}${ev.dressCode ? `<br>Dress code: ${h(ev.dressCode)}` : ""}${ev.contactoDia ? `<br>No dia: ${h(ev.contactoDia)}` : ""}</div>`;
const partyOrg = () => { const co = S.config; return `<div><span class="d-lab">Organização</span><b>${h(co.nome || "[Nome da empresa]")}</b>${co.responsavel ? `<br>${h(co.responsavel)}` : ""}${co.telefone ? `<br>${h(co.telefone)}` : ""}${co.email ? `<br>${h(co.email)}` : ""}</div>`; };
function quoteTable(ev, t){
  const L = ev.proposta?.linhas || [], ORD = [...MODS.map(m => m.n), "Organização", "Extras"];
  const cats = ORD.filter(c => L.some(l => l.cat === c)).concat([...new Set(L.map(l => l.cat))].filter(c => !ORD.includes(c)));
  return `<table><thead><tr><th>Descrição</th><th class="n">Qtd</th><th class="n">Preço un.</th><th class="n">IVA</th><th class="n">Total</th></tr></thead><tbody>
    ${cats.map(c => { const LL = L.filter(l => l.cat === c), st = LL.reduce((a,l) => a + lineSale(l), 0);
      return `<tr class="cat"><td colspan="4">${h(c)}</td><td class="n">${money(st)}</td></tr>` + LL.map(l => `<tr><td>${h(l.desc)}</td><td class="n">${h(l.qtd)} ${h(l.unid)}</td><td class="n">${money(l.preco)}</td><td class="n">${h(l.iva)}%</td><td class="n">${money(lineSale(l))}</td></tr>`).join(""); }).join("")}
  </tbody></table>
  <div class="d-sum"><table><tr><td>Subtotal</td><td class="n">${money(t.sub)}</td></tr>${Object.entries(t.iva).filter(([,v]) => v).map(([r,v]) => `<tr><td>IVA ${r}%</td><td class="n">${money(v)}</td></tr>`).join("")}<tr class="tot"><td>Total</td><td class="n">${money(t.total)}</td></tr>${pax(ev) ? `<tr class="pp"><td>Valor por pessoa (${pax(ev)})</td><td class="n">${money(t.total / pax(ev))}</td></tr>` : ""}</table></div>`;
}
function metroDoc(T, checks){
  let lf = null, out = "";
  T.forEach((t, i) => { const pc = t.fase === "Evento" ? palette(S.config).L.a : (PHCOL[t.fase] || "#8A938D"), c = DOCCOL[t.mod || ""] || "#7A817C", d = num(t.dur);
    if (t.fase !== lf){ out += `<div class="d-zone" style="--pc:${pc}"><i></i><span>${h(t.fase || "Programa")}</span></div>`; lf = t.fase; }
    out += `<div class="d-stn ${i === T.length - 1 ? "last" : ""}" style="--pc:${pc};--c:${c}"><div class="t">${t.m !== null ? fmtMin(t.m) : "—"}${d && t.m !== null ? `<small>até ${fmtMin(t.m + d)}</small>` : ""}</div><div class="r"><b></b></div><div class="b"><strong>${h(t.acao)}</strong>${t.resp || t.local ? `<br><small>${h([t.resp, t.local].filter(Boolean).join(" · "))}</small>` : ""}</div><div class="s"><em style="background:${c}">${LANEAB[t.mod || ""]}</em>${h(LANES[t.mod || ""] || "")}</div><div class="k">${checks ? `<i class="${t.feito ? "on" : ""}"></i>` : ""}</div></div>`; });
  return `<div class="d-metro">${out}</div>`;
}
function soBody(ev, k){
  const m = MOD[k], d = ev[k] || {}, o = osOf(ev, k), T = timeline(ev).filter(t => t.mod === k), t = totals(ev);
  const details = m.fields.filter(f => !["fornecedor","contacto"].includes(f[0]) && d[f[0]] !== undefined && d[f[0]] !== "");
  const itens = o.itens.length ? o.itens : (ev.proposta?.linhas || []).filter(l => l.cat === m.n);
  return `<div class="d-parties"><div><span class="d-lab">Fornecedor</span><b>${h(d.fornecedor)}</b>${d.contacto ? `<br>${h(d.contacto)}` : ""}${d.morada && k !== "espaco" ? `<br>${h(d.morada)}` : ""}</div>${partyOrg()}</div>
    ${details.length ? `<section class="d-sec"><h2>Detalhes do serviço</h2><dl class="d-kv">${details.map(f => `<dt>${h(f[1])}</dt><dd>${f[2] === "date" ? dt(d[f[0]]) : h(d[f[0]])}</dd>`).join("")}${k === "catering" && ev.restricoes ? `<dt>Restrições alimentares</dt><dd>${h(ev.restricoes)}</dd>` : ""}${ev.espaco?.fornecedor && k !== "espaco" && ev.modulos?.espaco ? `<dt>Local do evento</dt><dd>${h(ev.espaco.fornecedor)}${ev.espaco.morada ? ", " + h(ev.espaco.morada) : ""}${ev.espaco.sala ? " · " + h(ev.espaco.sala) : ""}</dd>` : ""}</dl></section>` : ""}
    ${itens.length ? `<section class="d-sec"><h2>Itens a fornecer</h2><table><thead><tr><th>Descrição</th><th class="n">Quantidade</th></tr></thead><tbody>${itens.map(l => `<tr><td>${h(l.desc)}</td><td class="n">${h(l.qtd)} ${h(l.unid)}</td></tr>`).join("")}</tbody></table></section>` : ""}
    ${T.length ? `<section class="d-sec"><h2>Horário <small>paragens da timeline deste fornecedor</small></h2>${metroDoc(T, false)}</section>` : ""}
    ${k === "alojamento" && (ev.rooming||[]).length ? `<section class="d-sec"><h2>Rooming list</h2><table><thead><tr><th>Quarto</th><th>Tipo</th><th>Hóspedes</th><th>Entrada</th><th>Saída</th><th>Regime</th></tr></thead><tbody>${ev.rooming.map(r => `<tr><td class="mono">${h(r.quarto)}</td><td>${h(r.tipo)}</td><td>${h(r.hospedes)}</td><td>${dt(r.checkin)}</td><td>${dt(r.checkout)}</td><td>${h(r.regime)}</td></tr>`).join("")}</tbody></table></section>` : ""}
    ${d.instrucoes ? `<section class="d-sec"><h2>Instruções</h2><div class="d-box">${h(d.instrucoes)}</div></section>` : ""}
    ${t.custoMod[k] ? `<section class="d-sec"><h2>Valor acordado</h2><dl class="d-kv"><dt>Total do serviço</dt><dd><b>${money(t.custoMod[k])}</b></dd></dl></section>` : ""}
    <div class="d-sig"><div>Pela organização · data</div><div>Confirmado pelo fornecedor · data</div></div>`;
}
function soFacts(ev, k){
  const T = timeline(ev).filter(t => t.mod === k && t.m !== null);
  return [["Data", dtLong(ev.data)], ["Chegada", T.length ? fmtMin(T[0].m) : "—"], ["Fim do serviço", T.length ? fmtMin(Math.max(...T.map(t => t.m + num(t.dur)))) : "—"], ["Convidados", paxTxt(ev)]];
}
function docHTML(ev, k){
  const t = totals(ev), ref = docRef(ev, k), co = S.config;
  if (k === "proposta") return {title:"Proposta", ref, html:docShell(ev, {kind:"Orçamento", title:"Proposta", ref, body:`
    <div class="d-parties">${partyCli(ev, true)}${partyEv(ev)}</div>
    <section class="d-sec"><h2>Serviços propostos ${ev.proposta?.validade ? `<small>válida até ${dt(ev.proposta.validade)}</small>` : ""}</h2>${quoteTable(ev, t)}</section>
    ${ev.proposta?.notas ? `<section class="d-sec"><h2>Notas</h2><div class="d-box">${h(ev.proposta.notas)}</div></section>` : ""}
    <section class="d-sec"><h2>Condições</h2><div class="d-box">${h(co.condicoes)}${co.iban ? `\nPagamento por transferência para o IBAN ${h(co.iban)}.` : ""}</div></section>
    <div class="d-sig"><div>Pela organização · data</div><div>Aceite pelo cliente · data e assinatura</div></div>`})};
  if (k === "proforma") return {title:"Fatura proforma", ref, html:docShell(ev, {kind:"Pedido de pagamento", title:"Fatura proforma", ref, body:`
    <div class="d-parties">${partyBill(ev)}${partyEv(ev, true)}</div>
    <section class="d-sec"><h2>Serviços</h2>${quoteTable(ev, t)}</section>
    <section class="d-sec"><h2>Plano de pagamentos</h2><table><thead><tr><th>Prestação</th><th>Data limite</th><th class="n">Valor</th></tr></thead><tbody><tr><td>Sinal (50%)</td><td>Na adjudicação</td><td class="n">${money(t.sinal)}</td></tr><tr><td>Restante (50%)</td><td>${ev.data ? dt(addDays(ev.data, -7)) : "—"}</td><td class="n">${money(t.total - t.sinal)}</td></tr></tbody></table>
    ${co.iban ? `<div class="d-note">Transferência para o IBAN <b>${h(co.iban)}</b>, indicando a referência <b>${h(ref)}</b>.</div>` : ""}</section>
    <div class="d-note">Documento sem valor fiscal. A fatura é emitida após cada pagamento.</div>`})};
  if (k === "fatura" || k === "extrato"){
    const pg = (ev.pagamentos||[]).filter(p => num(p.valor)), r = receivable(ev);
    return {title:k === "fatura" ? "Fatura" : "Extrato de conta", ref, html:docShell(ev, {kind:k === "fatura" ? "Rascunho para conferência" : "Situação de pagamentos", title:k === "fatura" ? "Fatura" : "Extrato de conta", ref, facts:[["Total do evento", money(t.total)], ["Recebido", money(t.pago)], ["Em falta", money(t.falta)], ["Data do evento", dt(ev.data)]], body:`

      <section class="d-sec"><h2>Pagamentos recebidos</h2><table><thead><tr><th>Data</th><th>Método</th><th>Referência</th><th class="n">Valor</th></tr></thead><tbody>${pg.length ? pg.map(p => `<tr><td>${dt(p.data)}</td><td>${h(p.metodo)}</td><td>${h(p.ref)}</td><td class="n">${money(p.valor)}</td></tr>`).join("") : `<tr><td colspan="4"><small>Sem pagamentos registados.</small></td></tr>`}</tbody></table>
      <div class="d-sum"><table><tr><td>Total</td><td class="n">${money(t.total)}</td></tr><tr><td>Recebido</td><td class="n">${money(t.pago)}</td></tr><tr class="tot"><td>Em falta</td><td class="n">${money(t.falta)}</td></tr></table></div></section>
      ${k === "fatura" ? `<div class="d-note">Rascunho para conferência. A fatura legal tem de ser emitida em software de faturação certificado ou no Portal das Finanças.</div>` : co.iban ? `<div class="d-note">Pagamento por transferência para o IBAN <b>${h(co.iban)}</b>, referência <b>${h(ev.ref)}</b>.</div>` : ""}`})};
  }
  if (k === "timeline"){
    const T = timeline(ev);
    return {title:"Timeline do evento", ref, html:docShell(ev, {kind:"Linha do dia", title:"Timeline", ref, body:`
      <div class="d-parties">${partyEv(ev)}<div><span class="d-lab">Fornecedores</span>${activeMods(ev).map(m => `<span style="display:flex;gap:6px;align-items:center"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${DOCCOL[m.k]}"></i>${h(m.n)}: <b>${h(ev[m.k]?.fornecedor || "—")}</b>${ev[m.k]?.contacto ? " · " + h(ev[m.k].contacto) : ""}</span>`).join("") || "—"}</div></div>
      <section class="d-sec"><h2>Programa <small>${T.length} paragens · marcar ✓ no dia</small></h2>${metroDoc(T, true)}</section>

const DRAFT_FORMS = ["evForm","cliForm","fornForm"];
const draftKey = id => "evt.draft." + id;
const draftable = () => !R.id && !R.fromPed && !R.prefill;
function saveDraft(f){ if (!f || !DRAFT_FORMS.includes(f.id) || !draftable()) return; const o = {}; for (const el of f.elements){ if (!el.name || el.type === "hidden" || el.type === "file") continue; o[el.name] = el.type === "checkbox" ? el.checked : el.value; } try { localStorage.setItem(draftKey(f.id), JSON.stringify({t:Date.now(), v:o})); } catch(e){} }
function clearDraft(id){ (id ? [id] : DRAFT_FORMS).forEach(k => { try { localStorage.removeItem(draftKey(k)); } catch(e){} }); }
function getDraft(id){ try { const d = JSON.parse(localStorage.getItem(draftKey(id)) || "null"); return d && Date.now() - d.t < 7 * 864e5 && Object.values(d.v || {}).some(v => v && v !== "0") ? d : null; } catch(e){ return null; } }
function draftNote(id){ return draftable() && getDraft(id) ? `<div class="draft-note"><span>↺ Recuperámos o que estavas a preencher.</span><button class="btn sm ghost" data-act="dropDraft">Começar do zero</button></div>` : ""; }
function restoreDraft(){ if (!draftable()) return; const f = DRAFT_FORMS.map(id => document.getElementById(id)).find(Boolean); const d = f && getDraft(f.id); if (d) fillForm(f, d.v, false); }
// Preenche um formulário por nome de campo; devolve quantos campos ficaram com valor
function fillForm(f, obj, mark){
  let n = 0;
  for (const [name, v] of Object.entries(obj)){
    const el = f.elements[name]; if (!el || el instanceof RadioNodeList || v === undefined || v === null) continue;
    if (el.type === "checkbox"){ if (el.checked !== !!v){ el.checked = !!v; el.dispatchEvent(new Event("change", {bubbles:true})); } if (v && mark){ el.closest("label")?.classList.add("ai-filled"); n++; } continue; }
    let val = String(v);
    if (el.tagName === "SELECT"){ const o = [...el.options].find(o => o.value === val) || [...el.options].find(o => o.text.trim().toLowerCase() === val.trim().toLowerCase()); if (!o) continue; val = o.value; }
    if (el.type === "date" && !/^\d{4}-\d{2}-\d{2}$/.test(val)) continue;
    if (el.type === "time"){ const m = /^(\d{1,2}):(\d{2})/.exec(val); if (!m) continue; val = m[1].padStart(2, "0") + ":" + m[2]; }
    if (el.type === "number"){ const x = parseFloat(val.replace(",", ".")); if (!isFinite(x)) continue; val = String(x); }
    el.value = val;
    if (el.value === val && val !== ""){ if (mark){ el.classList.add("ai-filled"); n++; } el.dispatchEvent(new Event("change", {bubbles:true})); }
  }
  return n;
}
function logoFromFile(file){
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type) || file.size > 8 * 1048576) return rej(new Error("tipo"));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("ler"));
    fr.onload = () => { const img = new Image(); img.onerror = () => rej(new Error("img")); img.onload = () => {
      const Z = 256, c = document.createElement("canvas"); c.width = c.height = Z; const x = c.getContext("2d");
      const nw = img.naturalWidth || Z, nh = img.naturalHeight || Z, r = Math.min(Z / nw, Z / nh), w = nw * r, hh = nh * r;
      x.drawImage(img, (Z - w) / 2, (Z - hh) / 2, w, hh);
      try { res(c.toDataURL("image/png")); } catch(e){ rej(e); } }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

  return `<div class="crumbs"><a href="#" data-act="go" data-v="tarefas">Tarefas</a> › ${h(t.titulo)}</div>
  <div class="head tk-head"><div style="flex:1;min-width:0"><input class="tk-title" data-tk="titulo" data-id="${t.id}" value="${h(t.titulo)}" aria-label="Título da tarefa" maxlength="200">
    <div class="muted small">Criada por ${h(t.criadoPorNome || tkUser(t.criadoPor)?.nome || "—")} · ${dt(t.criado)}</div></div>
    ${canDel ? `<span><button class="btn ghost danger" data-act="askDelTask" data-id="${t.id}">Apagar</button></span>` : ""}</div>
  <div class="seg tk-est" role="group" aria-label="Estado">${TK_EST.map(([k, n]) => `<button data-act="tkEstado" data-id="${t.id}" data-k="${k}" aria-pressed="${t.estado === k}">${n}</button>`).join("")}</div>
  <div class="cols tk-cols">
    <div class="stack">
      <section class="panel"><div class="grid">
        <label class="field"><span>Responsável</span><select data-tk="responsavel" data-id="${t.id}"><option value="">— ninguém —</option>${tkUsers().map(u => `<option value="${h(u.id)}" ${t.responsavel === u.id ? "selected" : ""}>${h(u.nome)} · ${h(u.role)}</option>`).join("")}</select></label>
        <label class="field"><span>Prazo</span><input type="date" data-tk="prazo" data-id="${t.id}" value="${h(t.prazo)}"></label>
        <label class="field"><span>Prioridade</span><select data-tk="prioridade" data-id="${t.id}">${TK_PRI.map(([k, n]) => `<option value="${k}" ${(t.prioridade || "normal") === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <label class="field"><span>Evento (opcional)</span><select data-tk="eventoId" data-id="${t.id}"><option value="">— nenhum —</option>${evs.map(e => `<option value="${e.id}" ${t.eventoId === e.id ? "selected" : ""}>${h(e.nome)} · ${dt(e.data)}</option>`).join("")}</select></label>
        <label class="field wide"><span>Descrição</span><textarea data-tk="descricao" data-id="${t.id}" placeholder="O que é preciso fazer, contexto, links…">${h(t.descricao)}</textarea></label>
      </div>${t.eventoId && S.eventos[t.eventoId] ? `<button class="btn sm" style="margin-top:12px" data-act="open" data-id="${t.eventoId}">Abrir o evento →</button>` : ""}</section>
      <section class="panel" id="sec-ck"><div class="panel-h"><div><h2>Lista de verificação</h2><span class="small muted">${p.n ? `${p.ok} de ${p.n} feitos` : "Divide a tarefa em passos pequenos."}</span></div></div>
        ${p.n ? `<div class="tk-bar" aria-hidden="true"><i style="width:${Math.round(p.ok / p.n * 100)}%"></i></div>` : ""}
        <ul class="ck-list">${(t.checklist || []).map(c => `<li class="${c.feito ? "done" : ""}"><input type="checkbox" data-ck="${t.id}" data-row="${c.id}" ${c.feito ? "checked" : ""} aria-label="Feito"><input class="ck-txt" data-ckt="${t.id}" data-row="${c.id}" value="${h(c.txt)}" aria-label="Passo">${c.feito && c.por ? `<span class="ck-by" title="Feito por ${h(c.por)}">✓ ${h(String(c.por).split(" ")[0])}</span>` : ""}<button class="btn ghost sm" data-act="delCk" data-id="${t.id}" data-row="${c.id}" aria-label="Apagar passo">×</button></li>`).join("")}</ul>
        <form class="ck-add" id="ckForm" data-id="${t.id}" autocomplete="off"><input id="ckIn" placeholder="Adicionar passo… (Enter)" aria-label="Novo passo" maxlength="300"><button class="btn sm" type="submit">Adicionar</button></form>
      </section>
    </div>
    <section class="panel" id="sec-notas"><div class="panel-h"><div><h2>Notas</h2><span class="small muted">As gerais são vistas por toda a equipa. As privadas só por ti.</span></div></div>
      <form class="note-form" id="noteForm" data-id="${t.id}">
        <textarea id="noteIn" placeholder="${vis === "privada" ? "Nota privada: só tu a vais ver…" : "Nota para a equipa…"}" aria-label="Texto da nota"></textarea>
        <div class="row" style="justify-content:space-between"><div class="seg" role="group" aria-label="Visibilidade da nota"><button type="button" data-act="noteVis" data-k="geral" aria-pressed="${vis === "geral"}">👥 Geral</button><button type="button" data-act="noteVis" data-k="privada" aria-pressed="${vis === "privada"}">🔒 Privada</button></div><button class="btn pri sm" type="submit">Guardar nota</button></div>
      </form>
      <div class="notes">${notes.length ? notes.map(n => `<article class="note ${n.privada ? "priv" : ""}"><header><span class="tk-av sm">${h(initials(n.autor))}</span><b>${h(n.autor)}</b><span class="muted small">${new Date(n.ts).toLocaleString("pt-PT", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})}</span>${n.privada ? `<span class="chip note-lock">🔒 Privada · só tu vês</span>` : ""}${n.autorId === user.id ? `<span style="margin-left:auto"><button class="btn ghost sm danger" data-act="delNote" data-id="${n.id}" aria-label="Apagar nota">Apagar</button></span>` : ""}</header><p>${h(n.txt)}</p></article>`).join("") : `<p class="muted small">Ainda não há notas.</p>`}</div>
    </section>
  </div>`;
}
function evTasksPanel(ev){
  const L = Object.values(S.tarefas).filter(t => t.eventoId === ev.id).sort((a, b) => (a.estado === "feita") - (b.estado === "feita"));
  return `<section class="panel"><div class="panel-h"><div><h2>Tarefas da equipa</h2><span class="small muted">${L.filter(t => t.estado !== "feita").length} abertas</span></div><div class="row"><button class="btn sm" data-act="evNewTask" data-id="${ev.id}">${ico("plus")}Nova tarefa</button>${L.length ? `<button class="btn ghost sm" data-act="goJ" data-j="${h(JSON.stringify({v:"tarefas", f:"todas", ev:ev.id}))}">Ver todas</button>` : ""}</div></div>
    ${L.length ? `<div class="tk-list">${L.slice(0, 6).map(tkCard).join("")}</div>` : `<p class="muted small">Sem tarefas ligadas a este evento.</p>`}</section>`;
}
Object.assign(ACT, {
  tkEstado: b => { mutTk(b.dataset.id, t => { t.estado = b.dataset.k; t.feitaEm = b.dataset.k === "feita" ? new Date().toISOString() : ""; }); render(); },
  delCk: b => { mutTk(b.dataset.id, t => { t.checklist = (t.checklist || []).filter(c => c.id !== b.dataset.row); }); render(); },
  noteVis: b => { R.nvis = b.dataset.k; const t = $("#noteIn"); const keep = t?.value || ""; render(); const n = $("#noteIn"); if (n){ n.value = keep; n.focus(); } },
  delNote: b => { del("notas", b.dataset.id); render(); toast("Nota apagada."); },
  askDelTask: b => { b.parentElement.innerHTML = `<span class="confirm">Apagar a tarefa e as notas? <button class="btn sm danger" data-act="doDelTask" data-id="${b.dataset.id}">Apagar</button><button class="btn sm ghost" data-act="noDel">Não</button></span>`; },
  doDelTask: b => { const id = b.dataset.id; Object.values(S.notas).filter(n => n.tarefaId === id && (!n.privada || n.autorId === user.id)).forEach(n => del("notas", n.id)); del("tarefas", id); go({v:"tarefas"}); toast("Tarefa apagada."); },
  evNewTask: b => { const ev = S.eventos[b.dataset.id]; const id = newTask("Nova tarefa · " + (ev?.nome || ""), {eventoId:b.dataset.id}); go({v:"tarefa", id}); setTimeout(() => { const i = $(".tk-title"); i?.focus(); i?.select(); }, 30); }
});
document.addEventListener("change", e => {
  const el = e.target, d = el.dataset;
  if (d.tkdone){ mutTk(d.tkdone, t => { t.estado = el.checked ? "feita" : "afazer"; t.feitaEm = el.checked ? new Date().toISOString() : ""; }); toast(el.checked ? "Tarefa feita. ✓" : "Tarefa reaberta."); schedule(); return; }
  if (d.tk){ const v = el.value; if (d.tk === "titulo" && !v.trim()){ render(); return; } mutTk(d.id, t => { t[d.tk] = d.tk === "titulo" ? v.trim().slice(0, 200) : v; }); schedule(); return; }
  if (d.ck){ mutTk(d.ck, t => { const c = (t.checklist || []).find(x => x.id === d.row); if (c){ c.feito = el.checked; c.por = el.checked ? user.nome : ""; } }); schedule(); return; }
  if (d.ckt){ mutTk(d.ckt, t => { const c = (t.checklist || []).find(x => x.id === d.row); if (c && el.value.trim()) c.txt = el.value.trim().slice(0, 300); }); schedule(); return; }
});
document.addEventListener("submit", e => {
  const f = e.target;
  if (f.id === "tkQuick"){ e.preventDefault(); e.stopImmediatePropagation(); const i = $("#tkQuickIn"), v = i.value.trim(); if (!v) return; newTask(v, R.ev ? {eventoId:R.ev} : {}); i.value = ""; render(); setTimeout(() => $("#tkQuickIn")?.focus(), 0); toast("Tarefa criada."); return; }
  if (f.id === "ckForm"){ e.preventDefault(); e.stopImmediatePropagation(); const i = $("#ckIn"), v = i.value.trim(); if (!v) return; mutTk(f.dataset.id, t => { t.checklist = [...(t.checklist || []), {id:uid("c"), txt:v.slice(0, 300), feito:false}]; }); render(); setTimeout(() => $("#ckIn")?.focus(), 0); return; }
  if (f.id === "noteForm"){ e.preventDefault(); e.stopImmediatePropagation(); const i = $("#noteIn"), v = i.value.trim(); if (!v) return; const id = uid("n"); put("notas", id, {id, tarefaId:f.dataset.id, txt:v.slice(0, 4000), autorId:user.id, autor:user.nome, ts:Date.now(), privada:(R.nvis || "geral") === "privada"}); render(); toast((R.nvis || "geral") === "privada" ? "Nota privada guardada. Só tu a vês." : "Nota guardada para a equipa."); return; }
}, true);

render();
initStore();
initAssets();
initAI();
})();
</script>
</body></html>
